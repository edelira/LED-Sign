# LED Sign: 64x64 P3 panels on an Adafruit Matrix Portal S3.
# Chain: Matrix Portal -> panel 1 IN, panel 1 OUT -> panel 2 IN -> panel 2 OUT -> panel 3 IN.
# Panels get 5V from the MEAN WELL through their own red/black leads; leave
# the Matrix Portal's screw terminals empty while it's on USB-C.
#
# The sign only draws. Home Assistant (packages/led_sign*.yaml in the HA repo)
# fetches weather, planes, trains and scores and does the math.
# The clock comes from network time with Home Assistant as a backup.
#
# Nothing is pushed: the sign reads its screens from HA sensors, so a
# rebooted sign catches up by itself and HA needs no "send to sign"
# automations. Each sensor is "none" when there is nothing to show.
#   sensor.led_sign_train        COMPANY|NAME|NUMBER|W/E|DEST|LATE|UNTIL_TS|PASS_TS|MPH
#   sensor.led_sign_plane        FLIGHT|TYPE|ROUTE|AIRLINE|ALT|RATE|SPEED|TRACK|DX|DY|RADIUS
#   sensor.led_sign_timer        LABEL|END_TS|DURATION
#   sensor.led_sign_leave        TITLE|AT|LEAVE_TS|START_TS|DRIVE|TRAFFIC
#   sensor.led_sign_now_playing  TITLE|ARTIST   (attribute art_url)
#   sensor.led_sign_bears_game   the ESPN summary, held back on the sign by
#                                input_number.led_sign_bears_delay (spoilers)
#   sensor.led_sign_alerts       see below
# One action is left for one-off messages: esphome.led_sign_show_message
# (line1, line2, seconds).
#
# Alerts: sensor.led_sign_alerts
# ("TITLE|DETAIL|ICON;TITLE|DETAIL|ICON" or "none", up to 4). A new alert
# takes the whole sign for 10 s; after that each one is a card on the clock
# screen (a tag on the music screen) until HA drops it from the list.
# Icons: washer (aqua, sparkling), dryer (orange, tumbling), door (red,
# dripping); anything else gets an amber "!". Adding an alert with one of
# these icons is a change in HA only (packages/led_sign.yaml).
#
# Full-screen moments, in priority order: timer's last minute / TIME'S UP,
# message, new alert, train passing, leave-by countdown, touchdown, scoreboard after a score, final score,
# plane overhead. Otherwise the screen is shared: music (or the clock and
# weather), with a timer bar on top while a timer runs and a Bears strip
# along the bottom during the game.

substitutions:
  panels: "3"          # panels chained left to right
  # Compass bearing the sign faces (straight up on the radar). The kitchen's
  # back wall faces north-northwest, ~16 degrees west of north.
  radar_heading: "344"

esphome:
  name: led-sign
  friendly_name: LED Sign
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
          else:
            - hub75.set_brightness:
                id: sign
                brightness: 0

esp32:
  board: adafruit_matrixportal_esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # The three panels' DMA buffers take most of the internal RAM; keep
      # TLS and Wi-Fi buffers in PSRAM.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: quad

logger:

api:
  actions:
    - action: show_message
      variables:
        line1: string
        line2: string
        seconds: int
      then:
        - lambda: |-
            id(msg_line1) = line1;
            id(msg_line2) = line2;
            id(msg_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 30);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Both sources set the same system clock, so the sign keeps time if either the
# internet (NTP) or Home Assistant is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
  - platform: homeassistant
    timezone: America/Chicago

# Only used to download album art from Home Assistant.
http_request:
  timeout: 4s

debug:
  update_interval: 60s

globals:
  - id: wx_temp
    type: float
    initial_value: 'NAN'
  - id: wx_hi
    type: float
    initial_value: 'NAN'
  - id: wx_lo
    type: float
    initial_value: 'NAN'
  - id: wx_code        # WMO-style code that picks the icon, -1 = no weather yet
    type: int
    initial_value: '-1'
  - id: wx_label
    type: std::string
  - id: wx_ts          # when the last good weather arrived (0 = never)
    type: int64_t
    initial_value: '0'
  - id: wx_lvl         # 0 light .. 2 heavy (animation strength)
    type: int
    initial_value: '0'
  - id: tm_code        # tomorrow's icon code, -1 = not known yet
    type: int
    initial_value: '-1'
  - id: tm_label
    type: std::string
  - id: msg_line1
    type: std::string
  - id: msg_line2
    type: std::string
  - id: msg_until
    type: int64_t
    initial_value: '0'
  - id: timer_label
    type: std::string
  - id: timer_end
    type: int64_t
    initial_value: '0'
  - id: timer_duration
    type: int
    initial_value: '0'
  # Alerts (read from HA's sensor.led_sign_alerts): {title, detail, icon} each
  - id: al_list
    type: std::vector<std::vector<std::string>>
  - id: al_ready       # false until the first list after boot (no flash for old alerts)
    type: bool
    initial_value: 'false'
  - id: al_flash_1
    type: std::string
  - id: al_flash_2
    type: std::string
  - id: al_flash_icon
    type: std::string
  - id: al_flash_until
    type: int64_t
    initial_value: '0'
  # Leave-by countdown (read from HA)
  - id: lv_title
    type: std::string
  - id: lv_at          # event start as text, e.g. "8:00"
    type: std::string
  - id: lv_leave
    type: int64_t
    initial_value: '0'
  - id: lv_start       # 0 = nothing to show
    type: int64_t
    initial_value: '0'
  - id: lv_drive       # minutes with live traffic
    type: int
    initial_value: '0'
  - id: lv_traffic     # minutes traffic adds over a normal drive
    type: int
    initial_value: '0'
  # Plane overhead (read from HA)
  - id: pl_flight
    type: std::string
  - id: pl_type
    type: std::string
  - id: pl_route
    type: std::string
  - id: pl_airline
    type: std::string
  - id: pl_alt
    type: int
    initial_value: '0'
  - id: pl_rate
    type: int
    initial_value: '0'
  - id: pl_gs
    type: float
    initial_value: '0'
  - id: pl_track
    type: float
    initial_value: '0'
  - id: pl_dx          # miles east of home
    type: float
    initial_value: '0'
  - id: pl_dy          # miles north of home
    type: float
    initial_value: '0'
  - id: pl_radius      # radar scale (HA's plane radius), miles
    type: float
    initial_value: '1.5'
  - id: pl_last_seen
    type: int64_t
    initial_value: '0'
  - id: pl_ms          # millis() of the last position, for gliding between updates
    type: uint32_t
    initial_value: '0'
  - id: pl_trail
    type: std::vector<std::pair<float, float>>
  # Train passing (read from HA)
  - id: tr_operator
    type: std::string
  - id: tr_name
    type: std::string
  - id: tr_number
    type: int
    initial_value: '0'
  - id: tr_west
    type: bool
    initial_value: 'false'
  - id: tr_dest
    type: std::string
  - id: tr_late
    type: int
    initial_value: '0'
  - id: tr_until
    type: int64_t
    initial_value: '0'
  - id: tr_start       # millis() when the current train arrived (animation clock)
    type: uint32_t
    initial_value: '0'
  - id: tr_pass_ms     # millis() when the front passes the house (0: old format, no timing)
    type: int64_t
    initial_value: '0'
  - id: tr_mph         # speed past the house
    type: float
    initial_value: '40'
  # Now playing (read from HA)
  - id: np_active
    type: bool
    initial_value: 'false'
  - id: np_title
    type: std::string
  - id: np_artist
    type: std::string
  - id: np_source
    type: std::string
  - id: np_art_url
    type: std::string
  - id: np_art_ok
    type: bool
    initial_value: 'false'
  - id: np_off_at      # music stopped: take the screen down at this time (0 = no)
    type: int64_t
    initial_value: '0'
  # Bears updates waiting out the spoiler delay: {apply at, ESPN summary}
  - id: g_queue
    type: std::vector<std::pair<int64_t, std::string>>
  # Bears game (read from HA)
  - id: g_state   # "pre", "in", "post", or empty = no game today
    type: std::string
  - id: g_kick
    type: std::string
  - id: g_opp
    type: std::string
  - id: g_home
    type: bool
    initial_value: 'true'
  - id: g_us
    type: int
    initial_value: '0'
  - id: g_them
    type: int
    initial_value: '0'
  - id: g_status
    type: std::string
  - id: g_down
    type: std::string
  - id: g_poss   # 1 = Bears have the ball, -1 = opponent
    type: int
    initial_value: '0'
  - id: g_channel
    type: std::string
  - id: g_us_c
    type: std::string
  - id: g_us_a
    type: std::string
  - id: g_opp_c
    type: std::string
  - id: g_opp_a
    type: std::string
  - id: g_td_until
    type: int64_t
    initial_value: '0'
  - id: g_b1_until
    type: int64_t
    initial_value: '0'
  - id: g_b6_until
    type: int64_t
    initial_value: '0'

switch:
  - platform: template
    name: "Display"
    id: display_on
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: sign
          brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
    turn_off_action:
      - hub75.set_brightness:
          id: sign
          brightness: 0
  - platform: template
    name: "Show planes"
    id: show_planes
    icon: mdi:airplane
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Show trains"
    id: show_trains
    icon: mdi:train
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (x * 255 / 100);'

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "Free memory"
  # Weather from Home Assistant (Met.no, falling back to Open-Meteo). Gaps
  # (unavailable / NaN) are ignored so the last good reading stays up.
  - platform: homeassistant
    id: ha_wx_temp
    entity_id: sensor.led_sign_temperature
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) return;
          id(wx_temp) = x;
          id(wx_ts) = id(sntp_time).now().timestamp;
  - platform: homeassistant
    id: ha_wx_hi
    entity_id: sensor.led_sign_today_high
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_hi) = x;'
  - platform: homeassistant
    id: ha_wx_lo
    entity_id: sensor.led_sign_today_low
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_lo) = x;'
  - platform: homeassistant
    id: ha_wx_lvl
    entity_id: sensor.led_sign_weather_intensity
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_lvl) = (int) x;'
  # Seconds to hold Bears updates back so the sign doesn't beat the TV.
  - platform: homeassistant
    id: ha_bears_delay
    entity_id: input_number.led_sign_bears_delay
    internal: true
  # Tomorrow's forecast (evening card)
  - platform: homeassistant
    id: ha_tm_hi
    entity_id: sensor.led_sign_tomorrow_high
    internal: true
  - platform: homeassistant
    id: ha_tm_lo
    entity_id: sensor.led_sign_tomorrow_low
    internal: true

text_sensor:
  - platform: homeassistant
    id: ha_wx_condition
    entity_id: sensor.led_sign_weather_condition
    internal: true
    on_value:
      - lambda: |-
          // HA weather condition -> label and icon code (codes follow the WMO
          // numbering the icon drawing uses).
          struct Wx { const char *ha, *label; int code; };
          static const Wx table[] = {
            {"sunny", "SUNNY", 0}, {"clear-night", "CLEAR", 100},
            {"partlycloudy", "PT CLOUDY", 2}, {"cloudy", "CLOUDY", 3},
            {"fog", "FOG", 45}, {"rainy", "RAIN", 61}, {"pouring", "RAIN", 65},
            {"snowy", "SNOW", 71}, {"snowy-rainy", "SLEET", 67}, {"hail", "HAIL", 96},
            {"lightning", "STORM", 95}, {"lightning-rainy", "STORM", 95},
            {"windy", "WINDY", 4}, {"windy-variant", "WINDY", 4},
            {"exceptional", "ALERT", 3},
          };
          // Unknown/unavailable: keep the last good condition.
          for (const auto &w : table)
            if (x == w.ha) { id(wx_label) = w.label; id(wx_code) = w.code; break; }
  - platform: homeassistant
    id: ha_tm_condition
    entity_id: sensor.led_sign_tomorrow_condition
    internal: true
    on_value:
      - lambda: |-
          // Same mapping as today's condition above.
          struct Wx { const char *ha, *label; int code; };
          static const Wx table[] = {
            {"sunny", "SUNNY", 0}, {"clear-night", "CLEAR", 100},
            {"partlycloudy", "PT CLOUDY", 2}, {"cloudy", "CLOUDY", 3},
            {"fog", "FOG", 45}, {"rainy", "RAIN", 61}, {"pouring", "RAIN", 65},
            {"snowy", "SNOW", 71}, {"snowy-rainy", "SLEET", 67}, {"hail", "HAIL", 96},
            {"lightning", "STORM", 95}, {"lightning-rainy", "STORM", 95},
            {"windy", "WINDY", 4}, {"windy-variant", "WINDY", 4},
            {"exceptional", "ALERT", 3},
          };
          for (const auto &w : table)
            if (x == w.ha) { id(tm_label) = w.label; id(tm_code) = w.code; break; }
  # What needs attention right now, worked out in HA:
  # "TITLE|DETAIL|ICON;..." or "none". See the note at the top.
  - platform: homeassistant
    id: ha_alerts
    entity_id: sensor.led_sign_alerts
    internal: true
    on_value:
      - lambda: |-
          // HA restarting: keep what's showing.
          if (x == "unavailable" || x == "unknown") return;
          std::vector<std::vector<std::string>> list;
          if (x != "none") {
            size_t a = 0;
            while (a < x.size() && list.size() < 4) {
              size_t b = x.find(';', a);
              if (b == std::string::npos) b = x.size();
              // One alert: up to three fields split on "|".
              std::vector<std::string> f;
              size_t p = a;
              while (f.size() < 3) {
                size_t q = x.find('|', p);
                if (q == std::string::npos || q > b || f.size() == 2) q = b;
                f.push_back(x.substr(p, q - p));
                if (q >= b) break;
                p = q + 1;
              }
              f.resize(3);
              if (!f[0].empty()) list.push_back(f);
              a = b + 1;
            }
          }
          // An alert that wasn't in the last list gets the full screen for 10 s.
          if (id(al_ready)) {
            for (const auto &n : list) {
              bool had = false;
              for (const auto &o : id(al_list)) had = had || o == n;
              if (!had) {
                id(al_flash_1) = n[0];
                id(al_flash_2) = n[1];
                id(al_flash_icon) = n[2];
                id(al_flash_until) = id(sntp_time).now().timestamp + 10;
                break;
              }
            }
          }
          id(al_ready) = true;
          id(al_list) = list;
  # ---- Screens read from HA. "none" = nothing to show; unavailable /
  # unknown (HA restarting) are ignored so what's on screen stays. ----
  # Train passing: COMPANY|NAME|NUMBER|W/E|DEST|LATE|UNTIL_TS|PASS_TS|MPH
  # (PASS_TS / MPH are optional: without them the old 125 px/s entrance runs.)
  - platform: homeassistant
    id: ha_train
    entity_id: sensor.led_sign_train
    internal: true
    on_value:
      - lambda: |-
          std::vector<std::string> p;
          for (size_t a = 0;;) {
            const size_t b = x.find('|', a);
            p.push_back(x.substr(a, b == std::string::npos ? b : b - a));
            if (b == std::string::npos) break;
            a = b + 1;
          }
          const int64_t now = id(sntp_time).now().timestamp;
          // "none" for a timed train: HA dropped it (its GPS is past the
          // house, or its window is over). If the animated train hasn't
          // reached the sign yet, end the screen now; one already crossing
          // finishes by itself.
          if (x == "none" && id(tr_pass_ms) > 0) {
            if ((int64_t) millis() < id(tr_pass_ms) - (int64_t) (96000.0f / (id(tr_mph) * 1.19f)))
              id(tr_until) = std::min(id(tr_until), now);
            return;
          }
          if (p.size() < 7) return;      // the train on screen runs out by itself
          const int number = atoi(p[2].c_str());
          // A new train (not a refresh of the one showing) restarts the
          // full-width entrance animation.
          const bool fresh = id(tr_until) <= now || number != id(tr_number);
          if (fresh) id(tr_start) = millis();
          if (p.size() >= 9 && atoll(p[7].c_str()) > 0) {
            // Pass time on the millis() clock. Once the train is on screen
            // it keeps its timing, so a refreshed prediction can't make it jump.
            const int64_t pass_ms = (int64_t) millis() + (atoll(p[7].c_str()) - now) * 1000;
            const float mph = std::max(10.0f, std::min(90.0f, (float) atof(p[8].c_str())));
            // On screen = the front has reached the sign's edge (half a sign,
            // 96 px, before the middle) at 1.19 px/s per mph.
            const bool visible = !fresh && id(tr_pass_ms) > 0 &&
                (int64_t) millis() >= id(tr_pass_ms) - (int64_t) (96000.0f / (id(tr_mph) * 1.19f));
            if (!visible) { id(tr_pass_ms) = pass_ms; id(tr_mph) = mph; }
          } else {
            id(tr_pass_ms) = 0;
          }
          id(tr_operator) = p[0];
          id(tr_name) = p[1];
          id(tr_number) = number;
          id(tr_west) = p[3] == "W";
          id(tr_dest) = p[4];
          id(tr_late) = atoi(p[5].c_str());
          if (id(tr_pass_ms) > 0) {
            // Timed: on screen until the animated train has crossed (the
            // train screen ends it right then); this is only the backstop.
            // Sizes as on the train screen: loco 57 px, cars 69 px + 2 px gap.
            const int trainL = 57 + (p[0] == "METRA" ? 7 : 5) * 71;
            const int64_t cross = (int64_t) ((96 + trainL) / (id(tr_mph) * 1.19f)) + 2;
            id(tr_until) = now + (id(tr_pass_ms) - (int64_t) millis()) / 1000 + cross;
          } else {
            // Old format: at least 15 s on screen.
            id(tr_until) = std::max((int64_t) atoll(p[6].c_str()), now + 15);
          }
  # Plane overhead: FLIGHT|TYPE|ROUTE|AIRLINE|ALT|RATE|SPEED|TRACK|DX|DY|RADIUS
  # (dx/dy/radius in miles), refreshed every 10 s while a plane is in range.
  - platform: homeassistant
    id: ha_plane
    entity_id: sensor.led_sign_plane
    internal: true
    on_value:
      - lambda: |-
          std::vector<std::string> p;
          for (size_t a = 0;;) {
            const size_t b = x.find('|', a);
            p.push_back(x.substr(a, b == std::string::npos ? b : b - a));
            if (b == std::string::npos) break;
            a = b + 1;
          }
          if (p.size() < 11) {
            if (x == "none") {
              id(pl_last_seen) = 0;
              id(pl_flight).clear();
            }
            return;
          }
          const float dx = atof(p[8].c_str()), dy = atof(p[9].c_str()), radius = atof(p[10].c_str());
          if (p[0] != id(pl_flight)) id(pl_trail).clear();
          id(pl_flight) = p[0];
          id(pl_type) = p[1];
          id(pl_route) = p[2];
          id(pl_airline) = p[3];
          id(pl_alt) = atoi(p[4].c_str());
          id(pl_rate) = atoi(p[5].c_str());
          id(pl_gs) = atof(p[6].c_str());
          id(pl_track) = atof(p[7].c_str());
          id(pl_dx) = dx;
          id(pl_dy) = dy;
          id(pl_radius) = radius > 0 ? radius : 1.5f;
          id(pl_trail).push_back({dx, dy});
          if (id(pl_trail).size() > 8) id(pl_trail).erase(id(pl_trail).begin());
          id(pl_last_seen) = id(sntp_time).now().timestamp;
          id(pl_ms) = millis();
  # Kitchen timer: LABEL|END_TS|DURATION. The sign counts down by itself and
  # shows TIME'S UP for a minute, so "none" only clears a timer that still
  # had time on it (cancelled early).
  - platform: homeassistant
    id: ha_timer
    entity_id: sensor.led_sign_timer
    internal: true
    on_value:
      - lambda: |-
          std::vector<std::string> p;
          for (size_t a = 0;;) {
            const size_t b = x.find('|', a);
            p.push_back(x.substr(a, b == std::string::npos ? b : b - a));
            if (b == std::string::npos) break;
            a = b + 1;
          }
          const int64_t now = id(sntp_time).now().timestamp;
          if (p.size() < 3) {
            if (x == "none" && id(timer_end) > now + 5) id(timer_end) = 0;
            return;
          }
          const int64_t end = atoll(p[1].c_str());
          const int duration = atoi(p[2].c_str());
          id(timer_label) = p[0].empty() ? std::string("TIMER") : p[0];
          id(timer_end) = end;
          id(timer_duration) = duration > 0 ? duration : (int) (end - now);
  # Leave-by countdown: TITLE|AT|LEAVE_TS|START_TS|DRIVE|TRAFFIC (unix
  # seconds, minutes). HA works out the drive and when to leave; the sign
  # counts down to leave_ts on its own and stops at start_ts.
  - platform: homeassistant
    id: ha_leave
    entity_id: sensor.led_sign_leave
    internal: true
    on_value:
      - lambda: |-
          std::vector<std::string> p;
          for (size_t a = 0;;) {
            const size_t b = x.find('|', a);
            p.push_back(x.substr(a, b == std::string::npos ? b : b - a));
            if (b == std::string::npos) break;
            a = b + 1;
          }
          if (p.size() < 6) {
            if (x == "none") id(lv_start) = 0;
            return;
          }
          id(lv_title) = p[0];
          id(lv_at) = p[1];
          id(lv_leave) = atoll(p[2].c_str());
          id(lv_start) = atoll(p[3].c_str());
          id(lv_drive) = atoi(p[4].c_str());
          id(lv_traffic) = atoi(p[5].c_str());
  # Now playing on the kitchen speakers: TITLE|ARTIST. The screen stays up
  # 15 s after the music stops (pauses between tracks).
  - platform: homeassistant
    id: ha_np
    entity_id: sensor.led_sign_now_playing
    internal: true
    on_value:
      - lambda: |-
          if (x == "unavailable" || x == "unknown") return;
          if (x == "none" || x.empty()) {
            if (id(np_active) && id(np_off_at) == 0) id(np_off_at) = id(sntp_time).now().timestamp + 15;
            return;
          }
          const size_t bar = x.find('|');
          id(np_title) = x.substr(0, bar);
          id(np_artist) = bar == std::string::npos ? std::string() : x.substr(bar + 1);
          id(np_source) = "KITCHEN";
          id(np_active) = true;
          id(np_off_at) = 0;
  # Album art for the track above: a URL the sign downloads itself, "-" when
  # the track has none, empty when nothing is playing (the last art stays).
  - platform: homeassistant
    id: ha_np_art
    entity_id: sensor.led_sign_now_playing
    attribute: art_url
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty() && x != "unavailable" && x != "unknown" && x != "None" && x != id(np_art_url);'
          then:
            - lambda: |-
                id(np_art_url) = x;
                id(np_art_ok) = false;
            - if:
                condition:
                  lambda: 'return x != "-";'
                then:
                  - online_image.set_url:
                      id: album_art
                      url: !lambda 'return x;'
                  - component.update: album_art
  # Bears game: HA's ESPN summary, queued here for the spoiler delay and
  # applied by the 1 s interval below.
  # state|kickoff|opponent|H/A|chi_score|opp_score|status|down|possession
  # |channel|chi_color|chi_alt|opp_color|opp_alt|kickoff_ts   (or none)
  - platform: homeassistant
    id: ha_bears
    entity_id: sensor.led_sign_bears_game
    internal: true
    on_value:
      - lambda: |-
          if (x == "unavailable" || x == "unknown" || x.empty()) return;
          // Live and final scores wait out the delay; previews and "none" don't.
          const bool hold = x.rfind("in|", 0) == 0 || x.rfind("post|", 0) == 0;
          const float d = id(ha_bears_delay).state;
          const int64_t at = id(sntp_time).now().timestamp + (hold && !std::isnan(d) ? (int) d : 0);
          if (id(g_queue).size() >= 16) id(g_queue).erase(id(g_queue).begin());
          id(g_queue).push_back({at, x});
  - platform: debug
    reset_reason:
      name: "Last restart reason"


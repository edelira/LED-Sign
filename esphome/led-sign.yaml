    id: f8
    size: 8
  - file: "gfonts://Silkscreen"
    id: f16
    size: 16
  - file: "gfonts://Silkscreen"
    id: f32
    size: 32

color:
  - id: c_amber
    red_int: 255
    green_int: 176
    blue_int: 60
  - id: c_red
    red_int: 255
    green_int: 40
    blue_int: 30
  - id: c_white
    red_int: 235
    green_int: 225
    blue_int: 200
  - id: c_dim
    red_int: 150
    green_int: 120
    blue_int: 70
  - id: c_gray
    red_int: 70
    green_int: 70
    blue_int: 70
  - id: c_cyan
    red_int: 60
    green_int: 200
    blue_int: 255
  - id: c_green
    red_int: 40
    green_int: 230
    blue_int: 80

# Redraw the screen every 80 ms (smooth scrolling), or every 40 ms (25 fps)
# while the train animation is on. The panels themselves refresh at
# min_refresh_rate.
interval:
  - interval: 40ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          bool animating = id(show_trains).state && id(tr_until) > id(sntp_time).now().timestamp;
          if (animating || ++tick % 2 == 0) id(sign).update();

display:
  - platform: hub75
    id: sign
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 64
    layout_cols: ${panels}
    layout: HORIZONTAL
    bit_depth: 8
    brightness: 100
    double_buffer: true
    # Redrawn by the interval above. With a fixed update_interval ESPHome
    # derives the panel refresh from it (~40 Hz), which flickers slightly.
    update_interval: never
    min_refresh_rate: 120
    # Hides faint green "ghost" streaks below bright pixels. (shift_driver:
    # FM6124 left the DMA uninitialised on this board; don't use it.)
    latch_blanking: 2
    lambda: |-
      const int W = it.get_width();
      auto now = id(sntp_time).now();
      // Print text, scrolling it sideways when it doesn't fit between x0 and x1.
      auto marquee = [&](int x0, int x1, int y, display::BaseFont *f, Color c, const std::string &s) {
        int bx, by, w, h;
        it.get_text_bounds(0, y, s.c_str(), f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        if (w <= x1 - x0) {
          it.print(x0, y, f, c, TextAlign::TOP_LEFT, s.c_str());
          return;
        }
        const int gap = 24, off = (millis() / 40) % (w + gap);
        it.start_clipping(x0, y, x1, y + h + 2);
        it.print(x0 - off, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.print(x0 - off + w + gap, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.end_clipping();
      };
      if (!now.is_valid()) {
        it.print(W / 2, 32, id(f8), id(c_dim), TextAlign::CENTER, "CONNECTING...");
        return;
      }
      const int64_t ts = now.timestamp;
      const bool wide = W >= 192;
      const Color line_c(35, 30, 25);

      // ---- Helpers ----
      // Print with y = top of the capital letters (Silkscreen leaves 4/7/13 px
      // above them at sizes 8/16/32).
      auto cap = [&](display::BaseFont *f) { return f == id(f8) ? 4 : (f == id(f16) ? 7 : 13); };
      auto txt = [&](int x, int y, display::BaseFont *f, Color c, TextAlign a, const std::string &s) {
        it.print(x, y - cap(f), f, c, a, s.c_str());
      };
      auto mq = [&](int x0, int x1, int y, display::BaseFont *f, Color c, const std::string &s) {
        marquee(x0, x1, y - cap(f), f, c, s);
      };
      auto text_w = [&](display::BaseFont *f, const std::string &s) {
        int bx, by, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        return w;
      };
      // The font has no real "&", so spell it out.
      auto and_fix = [](std::string s) {
        for (size_t p; (p = s.find('&')) != std::string::npos;) s.replace(p, 1, "AND");
        return s;
      };
      // Team colours arrive as ESPN hex strings. Scale them to a peak
      // brightness so dark navy still shows on LEDs; near-black becomes light
      // grey for text and stays black for backgrounds.
      auto hexc = [](const std::string &h, int peak) -> Color {
        unsigned long v = h.size() >= 6 ? strtoul(h.substr(h.size() - 6).c_str(), nullptr, 16) : 0;
        int r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255, m = std::max(r, std::max(g, b));
        if (m < 24) return peak > 150 ? Color(200, 200, 200) : Color(0, 0, 0);
        return Color(r * peak / m, g * peak / m, b * peak / m);
      };
      auto logo = [&](const std::string &abbr, bool big) -> image::Image * {
        struct L { const char *a; image::Image *b, *s; };
        static const L table[] = {
          {"ARI", id(logo_l_ari), id(logo_s_ari)},
          {"ATL", id(logo_l_atl), id(logo_s_atl)},
          {"BAL", id(logo_l_bal), id(logo_s_bal)},
          {"BUF", id(logo_l_buf), id(logo_s_buf)},
          {"CAR", id(logo_l_car), id(logo_s_car)},
          {"CHI", id(logo_l_chi), id(logo_s_chi)},
          {"CIN", id(logo_l_cin), id(logo_s_cin)},
          {"CLE", id(logo_l_cle), id(logo_s_cle)},
          {"DAL", id(logo_l_dal), id(logo_s_dal)},
          {"DEN", id(logo_l_den), id(logo_s_den)},
          {"DET", id(logo_l_det), id(logo_s_det)},
          {"GB", id(logo_l_gb), id(logo_s_gb)},
          {"HOU", id(logo_l_hou), id(logo_s_hou)},
          {"IND", id(logo_l_ind), id(logo_s_ind)},
          {"JAX", id(logo_l_jax), id(logo_s_jax)},
          {"KC", id(logo_l_kc), id(logo_s_kc)},
          {"LV", id(logo_l_lv), id(logo_s_lv)},
          {"LAC", id(logo_l_lac), id(logo_s_lac)},
          {"LAR", id(logo_l_lar), id(logo_s_lar)},
          {"MIA", id(logo_l_mia), id(logo_s_mia)},
          {"MIN", id(logo_l_min), id(logo_s_min)},
          {"NE", id(logo_l_ne), id(logo_s_ne)},
          {"NO", id(logo_l_no), id(logo_s_no)},
          {"NYG", id(logo_l_nyg), id(logo_s_nyg)},
          {"NYJ", id(logo_l_nyj), id(logo_s_nyj)},
          {"PHI", id(logo_l_phi), id(logo_s_phi)},
          {"PIT", id(logo_l_pit), id(logo_s_pit)},
          {"SF", id(logo_l_sf), id(logo_s_sf)},
          {"SEA", id(logo_l_sea), id(logo_s_sea)},
          {"TB", id(logo_l_tb), id(logo_s_tb)},
          {"TEN", id(logo_l_ten), id(logo_s_ten)},
          {"WSH", id(logo_l_wsh), id(logo_s_wsh)}
        };
        for (const auto &l : table)
          if (abbr == l.a) return big ? l.b : l.s;
        return nullptr;
      };
      const int hour12 = now.hour % 12 == 0 ? 12 : now.hour % 12;
      char hm[8];
      snprintf(hm, sizeof hm, "%d:%02d", hour12, now.minute);
      const char *ampm = now.hour < 12 ? "AM" : "PM";
      const int code = id(wx_code);
      const bool have_wx = code >= 0 && !std::isnan(id(wx_temp));
      char temp[8];
      snprintf(temp, sizeof temp, "%.0fF", id(wx_temp));
      const Color sun(255, 200, 40), cloud(170, 170, 190);
      // Animated weather icon in the 64-px panel centred on cx, top at oy, h rows
      // tall. code picks the scene (see the condition tables), lvl 0..2 how
      // lively rain, snow, storms and wind are. Everything moves on millis().
      const float tsec = millis() / 1000.0f;
      auto frac = [](float v) { return v - floorf(v); };
      auto cloud_at = [&](int x, int oy, Color col) {
        it.filled_circle(x - 6, 12 + oy, 5, col);
        it.filled_circle(x + 2, 9 + oy, 7, col);
        it.filled_circle(x + 9, 13 + oy, 4, col);
        it.filled_rectangle(x - 6, 13 + oy, 15, 5, col);
      };
      auto wx_icon = [&](int cx, int oy, int code, int lvl, int h) {
        lvl = std::max(0, std::min(lvl, 2));
        const int fall = std::max(2, h - 18);
        const Color rain_c(60, 140, 255), snow_c(255, 255, 255), bolt_c(255, 240, 120);
        const Color dark(110, 110, 130);
        auto drops = [&](int n, float speed, int slant, int len) {
          for (int i = 0; i < n; i++) {
            const float ph = frac(i * 0.618f), p = frac(tsec * speed + ph);
            const int x = cx - 11 + (i * 7) % 25 + slant, dx = (int) (-slant * p * 3);
            const int y = oy + 18 + (int) (p * fall);
            it.line(x + dx, y, x + dx - 1 - slant / 2, y + len, rain_c);
          }
        };
        auto flakes = [&](int n, float speed, float sway, bool big) {
          for (int i = 0; i < n; i++) {
            const float ph = frac(i * 0.618f + 0.3f), p = frac(tsec * speed + ph);
            const int x = cx - 12 + (i * 9) % 27 + (int) lroundf(sway * sinf(p * 4 * M_PI + ph * 6));
            const int y = oy + 18 + (int) (p * fall);
            it.draw_pixel_at(x, y, snow_c);
            if (big && i % 3 == 0) it.draw_pixel_at(x + 1, y, snow_c);
          }
        };
        it.start_clipping(cx - 31, oy, cx + 32, oy + h + 1);
        if (code == 100) {                       // clear night: crescent + twinkling stars
          it.filled_circle(cx - 2, 10 + oy, 7, Color(230, 230, 200));
          it.filled_circle(cx + 2, 7 + oy, 6, Color(0, 0, 0));
          static const int8_t st[6][2] = {{-20, 3}, {14, 2}, {18, 14}, {-16, 16}, {11, 22}, {-24, 10}};
          for (int i = 0; i < 6; i++) {
            const uint8_t b = 90 + (uint8_t) (165 * fabsf(sinf(tsec * 1.5f + i * 1.3f)));
            it.draw_pixel_at(cx + st[i][0], oy + st[i][1], Color(b, b, b));
          }
        } else if (code == 0) {                  // sunny: rays breathe slowly, no spinning
          const float b = 0.55f + 0.45f * (0.5f + 0.5f * sinf(tsec * M_PI / 2));
          const Color ray((uint8_t) (255 * b), (uint8_t) (200 * b), (uint8_t) (40 * b));
          it.filled_circle(cx, 10 + oy, 6, sun);
          for (int k = 0; k < 8; k++) {
            const float a = k * M_PI / 4;
            for (int r = 8; r <= 10; r++)
              it.draw_pixel_at(cx + lroundf(r * cosf(a)), 10 + oy + lroundf(r * sinf(a)), ray);
          }
        } else if (code == 2) {                  // partly: a cloud drifts across the sun
          it.filled_circle(cx - 6, 10 + oy, 6, sun);
          cloud_at(cx + lroundf(3 * sinf(tsec * M_PI / 2)), oy, cloud);
        } else if (code == 4) {                  // windy: gust streaks, more and faster when gusty
          const int n = lvl == 0 ? 2 : (lvl == 1 ? 3 : 5);
          const float sp = lvl == 0 ? 0.25f : (lvl == 1 ? 0.5f : 1.0f);
          for (int i = 0; i < n; i++) {
            const int y = oy + 4 + i * (std::max(h - 8, 8) / n), L = 12 + (i * 7) % 10;
            const int x0 = cx - 51 + (int) (frac(tsec * sp + i * 0.37f) * 70);
            const Color col = i % 2 ? Color(130, 130, 145) : cloud;
            it.horizontal_line(x0, y, L, col);
            it.draw_pixel_at(x0 + L + 1, y - 1, col);
            if (lvl == 2 && i % 2) {
              it.draw_pixel_at(x0 + L + 2, y - 2, col);
              it.draw_pixel_at(x0 + L + 1, y - 3, col);
            }
          }
        } else if (code == 45) {                 // fog: bands slide back and forth
          for (int i = 0; i < 4; i++) {
            const int off = lroundf(4 * sinf(tsec * 1.2f + i));
            it.horizontal_line(cx - 14 + off, oy + 4 + i * std::max(3, (h - 8) / 4), 28,
                               i % 2 ? Color(130, 130, 140) : Color(100, 100, 110));
          }
        } else if (code >= 95) {                 // storm: flashes and bolts, more when severe
          static const int fl0[] = {0}, fl1[] = {0, 2, 30}, fl2[] = {0, 2, 14, 30, 32, 40};
          const int *fl = lvl == 0 ? fl0 : (lvl == 1 ? fl1 : fl2);
          const int nfl = lvl == 0 ? 1 : (lvl == 1 ? 3 : 6), fr = (millis() % 4000) / 80;
          bool flash = false, bolt = false;
          for (int i = 0; i < nfl; i++) {
            if (fr == fl[i]) flash = true;
            if (fr == fl[i] || fr == fl[i] + 1) bolt = true;
          }
          cloud_at(cx, oy, flash ? Color(220, 220, 235) : dark);
          drops(lvl == 0 ? 4 : (lvl == 1 ? 9 : 16), (2 + lvl) / 4.0f, lvl, 2 + lvl);
          if (bolt) {
            it.line(cx + 2, oy + 18, cx - 1, oy + 24, bolt_c);
            it.line(cx - 1, oy + 24, cx + 3, oy + 24, bolt_c);
            it.line(cx + 3, oy + 24, cx, oy + 29, bolt_c);
            if (lvl == 2) {
              it.line(cx - 8, oy + 17, cx - 10, oy + 22, bolt_c);
              it.line(cx - 10, oy + 22, cx - 7, oy + 22, bolt_c);
              it.line(cx - 7, oy + 22, cx - 9, oy + 27, bolt_c);
            }
          }
        } else if (code >= 71 && code <= 86) {   // snow: more flakes, more sway when heavy
          cloud_at(cx, oy, cloud);
          flakes(lvl == 0 ? 5 : (lvl == 1 ? 10 : 18), lvl == 2 ? 0.5f : 0.25f,
                 lvl == 0 ? 1.0f : (lvl == 1 ? 1.5f : 2.5f), lvl == 2);
        } else if (code == 67) {                 // sleet: rain and snow together
          cloud_at(cx, oy, cloud);
          drops(5, 0.5f, 0, 2);
          flakes(5, 0.25f, 1.0f, false);
        } else if (code >= 51) {                 // rain: denser, faster, slanted when heavy
          cloud_at(cx, oy, lvl == 2 ? dark : cloud);
          drops(lvl == 0 ? 5 : (lvl == 1 ? 10 : 18), lvl == 0 ? 0.25f : (lvl == 1 ? 0.5f : 0.75f), lvl, 2 + lvl);
        } else {                                 // cloudy: two clouds drift past each other
          cloud_at(cx - 8 + lroundf(2 * sinf(tsec * 1.6f)), oy - 1, dark);
          cloud_at(cx + 2 + lroundf(3 * sinf(tsec * 1.6f + 2)), oy + 3, cloud);
        }
        it.end_clipping();
      };
      // Small version for the music screen's time line.
      auto wx_small = [&](int cx, int cy) {
        if (code == 100) {
          it.filled_circle(cx, cy, 4, Color(230, 230, 200));
          it.filled_circle(cx + 2, cy - 2, 3, Color(0, 0, 0));
          return;
        }
        if (code == 4) {
          it.horizontal_line(cx - 6, cy - 2, 10, cloud);
          it.horizontal_line(cx - 3, cy + 2, 10, cloud);
          return;
        }
        if (code <= 2) it.filled_circle(code == 0 ? cx : cx - 3, code == 0 ? cy : cy - 2, code == 0 ? 4 : 3, sun);
        if (code >= 1) {
          it.filled_circle(cx - 3, cy + 1, 3, cloud);
          it.filled_circle(cx + 2, cy - 1, 4, cloud);
          it.filled_rectangle(cx - 4, cy + 1, 10, 3, cloud);
        }
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
          for (int i = -3; i <= 3; i += 3) it.draw_pixel_at(cx + i, cy + 6, Color(60, 140, 255));
        if ((code >= 71 && code <= 77) || code == 85 || code == 86)
          for (int i = -3; i <= 3; i += 3) it.draw_pixel_at(cx + i, cy + 6, Color(255, 255, 255));
      };

      // ---- Timer: a bar along the top of the shared screen, then full
      // screen for the last minute and TIME'S UP ----
      bool tbar = false;
      if (id(timer_end) > 0) {
        int64_t rem = id(timer_end) - ts;
        if (rem > 60) {
          tbar = true;
        } else if (rem > 0) {
          it.print(W / 2, 0, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
          it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", (int) (rem / 60), (int) (rem % 60));
          if (id(timer_duration) > 0) {
            int bar = W - 32;
            int done = bar * (id(timer_duration) - rem) / id(timer_duration);
            it.filled_rectangle(16, 60, bar, 3, Color(60, 40, 10));
            it.filled_rectangle(16, 60, done, 3, id(c_amber));
          }
          return;
        } else if (rem > -60) {
          // Flash "TIME'S UP" for a minute, then fall through to the next screen.
          if ((millis() / 500) % 2 == 0) {
            it.print(W / 2, 14, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
            it.print(W / 2, 40, id(f16), id(c_red), TextAlign::CENTER, "TIME'S UP");
          }
          return;
        } else {
          id(timer_end) = 0;
        }
      }

      // ---- Message from Home Assistant ----
      if (id(msg_until) > ts) {
        it.print(W / 2, 22, id(f16), id(c_amber), TextAlign::CENTER, id(msg_line1).c_str());
        it.print(W / 2, 46, id(f8), id(c_white), TextAlign::CENTER, id(msg_line2).c_str());
        return;
      }

      // ---- Train passing ----
      if (id(show_trains).state && id(tr_until) > ts) {
        const bool wide = W >= 192;
        const int x0 = wide ? 70 : 2, xr = W - 2;
        const uint32_t el = millis() - id(tr_start);
        const bool left = id(tr_west);           // westbound runs right to left
        const float phase = el * 0.0225f;        // wheel spin

        // Colours by operator: Amtrak silver/blue/red, freight orange, Metra
        // blue locomotive with silver bi-level (gallery) cars.
        const bool metra = id(tr_operator) == "METRA";
        Color body(170, 175, 185), st1(30, 80, 200), st2(220, 30, 40);
        if (id(tr_operator) == "FREIGHT") { body = Color(230, 100, 20); st1 = Color(20, 20, 20); st2 = Color(255, 200, 40); }
        Color glass(110, 160, 230), locoBody = body, locoSt1 = st1;
        if (metra) { body = Color(165, 170, 180); st1 = Color(20, 70, 200); glass = Color(40, 55, 80);
                     locoBody = Color(20, 70, 200); locoSt1 = Color(165, 170, 180); }
        const Color dark(25, 30, 45), wheel(60, 60, 60);
        const Color rail(90, 90, 90), tie(60, 40, 25), lamp(255, 220, 60);

        // Drawing helpers, clipped by hand to [clip0, clip1).
        int clip0 = 0, clip1 = W;
        auto box = [&](int x, int y, int w, int h, Color c) {
          int a = std::max(x, clip0), b = std::min(x + w, clip1);
          int t = std::max(y, 0), u = std::min(y + h, 64);
          if (a < b && t < u) it.filled_rectangle(a, t, b - a, u - t, c);
        };
        auto wheels = [&](int x, int top, int L, int h) {
          int r = std::max(1, h / 8), y = top + h + r - 1;
          for (int cx : {x + 3 + r, x + 5 + 3 * r, x + L - 5 - 3 * r, x + L - 3 - r}) {
            for (int dy = -r; dy <= r; dy++) {
              int hw = (int) sqrtf(r * r + r - dy * dy);
              box(cx - hw, y + dy, 2 * hw + 1, 1, wheel);
            }
            box(cx + lroundf(r * 0.7f * cosf(phase)), y + lroundf(r * 0.7f * sinf(phase)), 1, 1, body);
          }
        };
        auto car = [&](int x, int top, int L, int h) {
          box(x + 1, top, L - 2, 1, body);
          box(x, top + 1, L, h - 1, body);
          if (metra) {
            // Gallery car: upper and lower window rows, thin blue/red belt.
            int ww = std::max(2, h / 6);
            for (int wx = x + 3; wx < x + L - 3; wx += ww + 2) {
              box(wx, top + h / 5, ww, ww, glass);
              box(wx, top + h / 2, ww, ww, glass);
            }
            box(x, top + h / 2 + ww + 1, L, 1, st1);
            box(x, top + h / 2 + ww + 2, L, 1, st2);
            wheels(x, top, L, h);
            return;
          }
          int wy = top + std::max(2, h / 5), wh = std::max(2, h / 4), s = std::max(1, h / 8);
          for (int wx = x + 3; wx < x + L - 4; wx += std::max(4, h / 3)) box(wx, wy, std::max(2, h / 5), wh, glass);
          box(x, wy + wh + 1, L, s, st1);
          box(x, wy + wh + 1 + s, L, 1, st2);
          wheels(x, top, L, h);
        };
        // faceLeft: which end the nose is on (a Metra loco pushing an
        // inbound train faces west, away from the direction of travel).
        auto loco = [&](int x, int top, int L, int h, bool faceLeft) {
          int nose = metra ? h / 3 : h / 2, s = std::max(1, h / 8);
          for (int i = 0; i < L; i++) {
            int d = faceLeft ? i : L - 1 - i;          // distance from the nose end
            int t = d < nose ? top + nose - d : top;   // sloped nose
            box(x + i, t, 1, top + h - t, locoBody);
          }
          int cw = std::max(3, h / 3);
          box(faceLeft ? x + nose - 1 : x + L - nose - cw + 1, top + h / 4 + 1, cw, std::max(2, h / 4), metra ? glass : dark);
          box(x, top + h * 3 / 5, L, s, locoSt1);
          box(x, top + h * 3 / 5 + s, L, 1, st2);
          box(faceLeft ? x + 1 : x + L - 3, top + h - std::max(3, h / 4), 2, 2, lamp);
          wheels(x, top, L, h);
        };
        auto track = [&](int y) {
          box(clip0, y, clip1 - clip0, 1, rail);
          for (int x = clip0; x < clip1; x += 5) box(x, y + 1, 1, 1, tie);
        };

        // Entrance: a locomotive and three cars run across the whole sign.
        const int h = 24, top = 30, cars = 3, gap = 2;
        const int locoL = h * 12 / 5, carL = h * 29 / 10;
        const int trainL = locoL + cars * (carL + gap);
        const int run = (int) (el * 0.125f);     // 125 px/s
        if (wide && run < W + trainL) {
          std::string title = id(tr_operator);
          if (id(tr_number) > 0) title += "  #" + std::to_string(id(tr_number));
          it.print(W / 2, 2, id(f16), id(c_amber), TextAlign::TOP_CENTER, title.c_str());
          track(top + h + 5);
          // Leading end first: westbound enters from the right.
          int x = left ? W - run : run - trainL;
          if (left) {
            loco(x, top, locoL, h, true);
            for (int c = 0, cx = x + locoL + gap; c < cars; c++, cx += carL + gap) car(cx, top, carL, h);
          } else if (metra) {
            // Push-pull: the loco stays on the Aurora end, the cab car leads.
            loco(x, top, locoL, h, true);
            int cx = x + locoL + gap;
            for (int c = 0; c < cars; c++, cx += carL + gap) car(cx, top, carL, h);
            box(cx - gap - 3, top + h - 5, 2, 2, lamp);
          } else {
            int cx = x;
            for (int c = 0; c < cars; c++, cx += carL + gap) car(cx, top, carL, h);
            loco(cx, top, locoL, h, false);
          }
          return;
        }

        if (wide) {
          // Left panel: cars rolling past in the direction of travel.
          const int sh = 14, sL = sh * 29 / 10, step = sL + 2;
          clip0 = 0; clip1 = 64;
          track(41);
          int off = (int) (el * 0.05f) % step;
          for (int x = left ? -off : off - step; x < 64; x += step) car(x, 22, sL, sh);
          it.print(32, 50, id(f8), metra ? Color(40, 100, 230) : id(c_red), TextAlign::TOP_CENTER,
                   id(tr_operator).c_str());
          for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
        }
        marquee(x0, xr, 0, id(f16), id(c_amber), id(tr_name));
        it.printf(x0, 19, id(f8), id(c_white), TextAlign::TOP_LEFT, "#%d  %s", id(tr_number),
                  metra ? (id(tr_west) ? "OUTBOUND" : "INBOUND") : (id(tr_west) ? "WESTBOUND" : "EASTBOUND"));
        std::string dest = "TO " + id(tr_dest);
        for (auto &ch : dest) ch = toupper(ch);
        marquee(x0, xr, 31, id(f8), id(c_white), dest);
        if ((millis() / 600) % 2 == 0)
          it.print(x0, 52, id(f8), id(c_red), TextAlign::TOP_LEFT, "PASSING");
        if (id(tr_late) > 1)
          it.printf(xr, 52, id(f8), id(c_red), TextAlign::TOP_RIGHT, "%d MIN LATE", id(tr_late));
        else
          it.print(xr, 52, id(f8), id(c_green), TextAlign::TOP_RIGHT, "ON TIME");
        return;
      }

      // ---- Leave-by countdown: green, then yellow under 20 min, orange
      // under 10, then a flashing GO NOW and LATE until the event starts ----
      if (wide && id(lv_start) > ts) {
        const int64_t until = id(lv_leave) - ts;
        const int m = until > 0 ? (int) ((until + 59) / 60) : -(int) (-until / 60);
        const Color c = m > 20 ? Color(40, 220, 90) : m > 10 ? Color(255, 210, 40)
                      : m > 0 ? Color(255, 130, 20) : id(c_red);
        const bool blink = (millis() / 500) % 2 == 0;
        auto box = [&](int x, int y, int w, int h, Color col) { it.filled_rectangle(x, y, w, h, col); };
        // Side-view car, 21 x 11, at (6, 8).
        {
          const int x = 6, y = 8;
          const Color glass(40, 55, 80), tyre(90, 90, 90), hub(30, 30, 30);
          box(x + 5, y, 10, 1, c); box(x + 4, y + 1, 12, 1, c);
          box(x + 3, y + 2, 2, 3, c); box(x + 15, y + 2, 2, 3, c); box(x + 10, y + 1, 1, 4, c);
          box(x + 5, y + 2, 4, 3, glass); box(x + 11, y + 2, 4, 3, glass);
          box(x, y + 5, 21, 4, c);
          box(x + 19, y + 6, 2, 1, Color(255, 220, 60)); box(x, y + 6, 1, 1, id(c_red));
          for (int wx : {x + 3, x + 14}) { box(wx, y + 8, 4, 3, tyre); box(wx + 1, y + 9, 2, 1, hub); }
        }
        if (id(lv_drive) > 0) {
          if (id(lv_traffic) >= 2) {
            char t[8];
            snprintf(t, sizeof t, "+%d", id(lv_traffic));
            txt(6, 26, id(f8), Color(255, 130, 20), TextAlign::TOP_LEFT, t);
          } else {
            txt(6, 26, id(f8), id(c_green), TextAlign::TOP_LEFT, "CLEAR");
          }
          txt(6, 35, id(f8), id(c_dim), TextAlign::TOP_LEFT, "TRAFFIC");
        }
        char big[12];
        if (m > 0) {
          if (m < 100) snprintf(big, sizeof big, "%d MIN", m);
          else snprintf(big, sizeof big, "%dH%02d", m / 60, m % 60);
          txt(118, 2, id(f8), id(c_dim), TextAlign::TOP_CENTER, "LEAVE IN");
          txt(118, 13, id(f32), c, TextAlign::TOP_CENTER, big);
        } else {
          if (m == 0) snprintf(big, sizeof big, "GO NOW");
          else snprintf(big, sizeof big, "LATE %d", -m);
          txt(118, 2, id(f8), blink ? id(c_red) : id(c_dim), TextAlign::TOP_CENTER, "TIME TO GO");
          txt(118, 13, id(f32), blink ? id(c_red) : Color(120, 20, 15), TextAlign::TOP_CENTER, big);
        }
        it.horizontal_line(0, 53, W, Color(35, 35, 35));
        char drv[20];
        if (id(lv_drive) > 0) snprintf(drv, sizeof drv, "%d MIN DRIVE", id(lv_drive));
        else snprintf(drv, sizeof drv, "NO ROUTE");
        const int dw = text_w(id(f8), drv);
        txt(W - 3, 56, id(f8), id(c_dim), TextAlign::TOP_RIGHT, drv);
        std::string line = and_fix(id(lv_title));
        if (!id(lv_at).empty()) line += " " + id(lv_at);
        mq(3, W - 3 - dw - 8, 56, id(f8), id(c_white), line);
        return;
      }

      // ---- Bears: touchdown, scoreboard after a score, final score ----
      if (wide && !id(g_state).empty()) {
        const Color usbg = hexc(id(g_us_c), 110), usfg = hexc(id(g_us_a), 255);
        const Color opbg = hexc(id(g_opp_c), 110), opfg = hexc(id(g_opp_a), 255);
        const std::string us_s = std::to_string(id(g_us)), op_s = std::to_string(id(g_them));
        if (id(g_td_until) > ts) {
          it.filled_rectangle(0, 0, W, 64, usbg);
          const int o = (millis() / 120) % 8;   // marching stripes
          for (int x = o; x + 4 <= W; x += 8) {
            it.filled_rectangle(x, 0, 4, 3, usfg);
            if (W - x - 4 >= 0) it.filled_rectangle(W - x - 4, 61, 4, 3, usfg);
          }
          txt(W / 2, 7, id(f16), usfg, TextAlign::TOP_CENTER, "TOUCHDOWN BEARS!");
          txt(W / 2, 26, id(f32), id(c_white), TextAlign::TOP_CENTER, us_s + "-" + op_s);
          return;
        }
        if (id(g_b1_until) > ts && id(g_state) == "in") {
          auto team = [&](int x, const std::string &abbr, Color bg, Color fg) {
            if (auto *img = logo(abbr, true)) {
              it.image(x, 1, img);
            } else {
              it.filled_circle(x + 14, 15, 14, bg);
              txt(x + 14, 13, id(f8), fg, TextAlign::TOP_CENTER, abbr);
            }
          };
          team(2, "CHI", usbg, usfg);
          team(162, id(g_opp), opbg, opfg);
          txt(36, 6, id(f16), usfg, TextAlign::TOP_LEFT, us_s);
          txt(156, 6, id(f16), opfg, TextAlign::TOP_RIGHT, op_s);
          if (id(g_poss) != 0) it.filled_circle(id(g_poss) > 0 ? 49 : 143, 25, 2, id(c_white));
          // Status like "Q3 8:42": quarter above the clock.
          const std::string &st = id(g_status);
          const size_t sp = st.find(' ');
          txt(W / 2, 6, id(f8), id(c_dim), TextAlign::TOP_CENTER, st.substr(0, sp));
          if (sp != std::string::npos) txt(W / 2, 16, id(f8), id(c_white), TextAlign::TOP_CENTER, st.substr(sp + 1));
          txt(W / 2, 36, id(f8), id(c_amber), TextAlign::TOP_CENTER, and_fix(id(g_down)));
          it.horizontal_line(0, 51, W, line_c);
          txt(2, 55, id(f8), id(c_amber), TextAlign::TOP_LEFT, std::string(hm) + " " + ampm);
          if (have_wx) txt(W - 2, 55, id(f8), id(c_white), TextAlign::TOP_RIGHT, temp);
          return;
        }
        if (id(g_b6_until) > ts && id(g_state) == "post") {
          txt(W / 2, 2, id(f8), id(c_dim), TextAlign::TOP_CENTER, id(g_status));
          it.filled_rectangle(0, 14, 94, 26, usbg);
          it.filled_rectangle(98, 14, 94, 26, opbg);
          txt(3, 22, id(f16), usfg, TextAlign::TOP_LEFT, "CHI");
          txt(91, 22, id(f16), usfg, TextAlign::TOP_RIGHT, us_s);
          txt(101, 22, id(f16), opfg, TextAlign::TOP_LEFT, id(g_opp));
          txt(189, 22, id(f16), opfg, TextAlign::TOP_RIGHT, op_s);
          const int d = id(g_us) - id(g_them);
          txt(W / 2, 48, id(f8), d > 0 ? id(c_green) : (d < 0 ? id(c_red) : id(c_white)), TextAlign::TOP_CENTER,
              d > 0 ? "BEARS WIN" : (d < 0 ? "BEARS LOSE" : "TIE GAME"));
          return;
        }
      }

      // ---- Plane overhead ----
      // HA updates every ~10 s while a plane is overhead; drop it if updates stop.
      if (id(show_planes).state && id(pl_last_seen) > 0 && ts - id(pl_last_seen) < 45 && !id(pl_flight).empty()) {
        // HA sends a position every ~10 s. In between, move the plane along its
        // heading at its ground speed (knots -> statute miles per second), for at
        // most 15 s so a lost update doesn't send it off the screen.
        const float dt = std::min((millis() - id(pl_ms)) / 1000.0f, 15.0f);
        const float mps = id(pl_gs) * 1.15078f / 3600.0f;
        const float trk = id(pl_track) * M_PI / 180.0f;
        const float pdx = id(pl_dx) + mps * dt * sinf(trk), pdy = id(pl_dy) + mps * dt * cosf(trk);
        const bool radar = W >= 192;
        const int x0 = radar ? 70 : 2, xr = W - 2;
        if (radar) {
          const int cx = 31, cy = 31;
          const float scale = 30.0f / id(pl_radius);
          // Turn the map so "up" is the direction the sign faces.
          const float hd = ${radar_heading} * M_PI / 180.0f;
          auto to_screen = [&](float east, float north, int &sx, int &sy) {
            const float right = east * cosf(hd) - north * sinf(hd);
            const float ahead = east * sinf(hd) + north * cosf(hd);
            sx = cx + lroundf(right * scale);
            sy = cy - lroundf(ahead * scale);
          };
          it.start_clipping(0, 0, 63, 64);   // keep a gliding plane off the text
          Color ring(0, 70, 30);
          for (int r = 10; r <= 30; r += 10) it.circle(cx, cy, r, ring);
          int px, py;
          for (auto &p : id(pl_trail)) {
            to_screen(p.first, p.second, px, py);
            it.draw_pixel_at(px, py, Color(90, 90, 40));
          }
          to_screen(pdx, pdy, px, py);
          float tr = id(pl_track) * M_PI / 180.0f - hd;
          it.line(px, py, px + (int) (5 * sinf(tr)), py - (int) (5 * cosf(tr)), id(c_amber));
          it.filled_rectangle(px - 1, py - 1, 3, 3, id(c_amber));
          it.filled_rectangle(cx - 1, cy - 1, 3, 3, Color(40, 230, 80));   // home
          // "N" on the outer ring, where north really is.
          const int nx = cx + lroundf(27 * sinf(-hd)), ny = cy - lroundf(27 * cosf(-hd));
          it.filled_rectangle(nx - 4, ny - 4, 9, 8, Color(0, 0, 0));
          it.print(nx, ny - 7, id(f8), id(c_dim), TextAlign::TOP_CENTER, "N");
          it.end_clipping();
          for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
        }
        it.print(x0, 0, id(f16), id(c_amber), TextAlign::TOP_LEFT, id(pl_flight).c_str());
        it.print(xr, 2, id(f8), id(c_amber), TextAlign::TOP_RIGHT, id(pl_type).c_str());
        it.print(x0, 19, id(f16), id(c_white), TextAlign::TOP_LEFT, id(pl_route).c_str());
        int alt = id(pl_alt);
        const char *arrow = id(pl_rate) > 300 ? " ^" : (id(pl_rate) < -300 ? " v" : "");
        if (alt >= 1000)
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d,%03d FT%s", alt / 1000, alt % 1000, arrow);
        else
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d FT%s", alt, arrow);
        it.printf(xr, 40, id(f8), id(c_cyan), TextAlign::TOP_RIGHT, "%.0f KT", id(pl_gs));
        it.print(x0, 52, id(f8), id(c_dim), TextAlign::TOP_LEFT, id(pl_airline).c_str());
        float d = sqrtf(pdx * pdx + pdy * pdy);
        it.printf(xr, 52, id(f8), id(c_dim), TextAlign::TOP_RIGHT, "%.1f MI", d);
        return;
      }

      // ---- Shared screen: music (or clock + weather), with a timer bar on
      // top while a timer runs and a Bears strip along the bottom on game day ----
      const bool music = id(np_active);
      const std::string &gs = id(g_state);
      // Pre-game goes in the weather spot on the clock screen, in the strip otherwise.
      // After the game, only the 15-minute final-score screen; no strip.
      const bool strip = wide && !gs.empty() && (gs != "pre" || music) && gs != "post";
      const int ox = (music && wide) ? 64 : 0;   // music keeps the album art panel whole
      const int top = tbar ? 16 : 0, bot = strip ? 51 : 64;

      if (tbar) {
        const int64_t rem = id(timer_end) - ts;
        const int bw = W - ox;
        it.filled_rectangle(ox, 0, bw, 15, Color(60, 35, 0));
        if (id(timer_duration) > 0) {
          int done = bw * (id(timer_duration) - rem) / id(timer_duration);
          it.filled_rectangle(ox, 13, std::max(0, std::min(done, bw)), 2, id(c_amber));
        }
        txt(ox + 3, 3, id(f8), id(c_amber), TextAlign::TOP_LEFT, id(timer_label));
        char tl[12];
        if (rem >= 3600)
          snprintf(tl, sizeof tl, "%d:%02d:%02d", (int) (rem / 3600), (int) (rem % 3600 / 60), (int) (rem % 60));
        else
          snprintf(tl, sizeof tl, "%d:%02d", (int) (rem / 60), (int) (rem % 60));
        txt(W - 3, 3, id(f8), id(c_amber), TextAlign::TOP_RIGHT, tl);
      }

      if (strip) {
        const int sw = W - ox, y = 51;
        const bool roomy = sw >= 192;
        const int mid = ox + (roomy ? 80 : sw / 2);
        const Color usbg = hexc(id(g_us_c), 110), usfg = hexc(id(g_us_a), 255);
        const Color opbg = hexc(id(g_opp_c), 110), opfg = hexc(id(g_opp_a), 255);
        if (gs == "pre") {
          it.filled_rectangle(ox, y, sw, 13, usbg);
          txt(ox + sw / 2, y + 4, id(f8), usfg, TextAlign::TOP_CENTER,
              std::string("BEARS ") + (id(g_home) ? "VS " : "AT ") + id(g_opp) + " " + id(g_kick));
        } else {
          it.filled_rectangle(ox, y, mid - ox, 13, usbg);
          it.filled_rectangle(mid, y, W - mid, 13, opbg);
          int lx = ox + 3, rx = mid + 3;
          if (roomy) {
            if (auto *l = logo("CHI", false)) { it.image(ox + 2, y, l); lx = ox + 18; }
            if (auto *l = logo(id(g_opp), false)) { it.image(mid + 2, y, l); rx = mid + 18; }
          }
          txt(lx, y + 4, id(f8), usfg, TextAlign::TOP_LEFT, "CHI " + std::to_string(id(g_us)));
          txt(rx, y + 4, id(f8), opfg, TextAlign::TOP_LEFT, id(g_opp) + " " + std::to_string(id(g_them)));
          std::string st = gs == "post" ? std::string(roomy ? "FINAL" : "F") : id(g_status);
          if (!roomy) st = st.substr(0, st.find(' '));
          txt(W - 3, y + 4, id(f8), id(c_white), TextAlign::TOP_RIGHT, st);
        }
      }

      if (music) {
        const int x0 = wide ? 70 : 2, xr = W - 2;
        if (wide) {
          if (id(np_art_ok)) {
            // Centre covers that aren't square (video thumbnails come in 16:9).
            it.image((64 - id(album_art)->get_width()) / 2, (64 - id(album_art)->get_height()) / 2, id(album_art));
          } else {
            // Music note placeholder while the album art loads (or if there is none).
            it.filled_circle(24, 42, 7, id(c_amber));
            it.filled_circle(42, 38, 7, id(c_amber));
            it.filled_rectangle(29, 16, 3, 27, id(c_amber));
            it.filled_rectangle(47, 12, 3, 27, id(c_amber));
            it.filled_rectangle(29, 12, 21, 5, id(c_amber));
          }
        }
        const std::string title = and_fix(id(np_title)), artist = and_fix(id(np_artist));
        if (!tbar && !strip) {
          // Title, artist, then a big time and the weather, spread evenly
          // down the panel.
          mq(x0, xr, 6, id(f16), id(c_amber), title);
          mq(x0, xr, 26, id(f8), id(c_white), artist);
          it.horizontal_line(x0 - 4, 40, xr - x0 + 6, line_c);
          txt(x0, 47, id(f16), id(c_amber), TextAlign::TOP_LEFT, hm);
          txt(x0 + text_w(id(f16), hm) + 5, 47, id(f8), id(c_dim), TextAlign::TOP_LEFT, ampm);
          // The night before pickup, a green TRASH / TMRW tag takes the
          // weather's spot every other 8 s (or for good if there's no weather).
          if (id(ha_trash).state && (!have_wx || (millis() / 8000) % 2)) {
            const Color tag_bg(15, 60, 30), tag_fg(60, 200, 100);
            it.filled_rectangle(xr - 44, 45, 46, 15, tag_bg);     // clears "12:59 PM"
            it.filled_rectangle(xr - 41, 47, 7, 2, tag_fg);       // lid
            it.filled_rectangle(xr - 40, 49, 5, 9, tag_fg);       // can
            it.horizontal_line(xr - 39, 51, 3, tag_bg);           // ribs
            it.horizontal_line(xr - 39, 54, 3, tag_bg);
            txt(xr - 31, 46, id(f8), tag_fg, TextAlign::TOP_LEFT, "TRASH");
            txt(xr - 31, 53, id(f8), tag_fg, TextAlign::TOP_LEFT, "TMRW");
          } else if (have_wx) {
            txt(xr, 47, id(f16), id(c_white), TextAlign::TOP_RIGHT, temp);
            wx_small(xr - text_w(id(f16), temp) - 10, 52);
          }
        } else {
          const int ty = top + (tbar ? 3 : 4);
          mq(x0, xr, ty, id(f16), id(c_amber), title);
          mq(x0, xr, ty + 19, id(f8), id(c_white), artist);
          if (!(tbar && strip)) {   // no room for the time when both bars are up
            const int yl = tbar ? 53 : 37;
            if (tbar) it.horizontal_line(x0 - 4, 49, xr - x0 + 6, line_c);
            txt(x0, yl, id(f8), id(c_amber), TextAlign::TOP_LEFT, std::string(hm) + " " + ampm);
            if (have_wx)
              txt(xr, yl, id(f8), id(c_white), TextAlign::TOP_RIGHT, std::string(temp) + " " + id(wx_label));
          }
        }
        return;
      }

      // Clock on the first two panels.
      const int clock_w = wide ? 128 : W;
      if (!tbar && !strip) {
        it.printf(clock_w / 2 - 6, 26, id(f32), id(c_amber), TextAlign::CENTER, "%s", hm);
        it.print(clock_w - 2, 8, id(f8), id(c_dim), TextAlign::TOP_RIGHT, ampm);
        it.strftime(clock_w / 2, 54, id(f8), id(c_dim), TextAlign::CENTER, "%a %b %d", now);
      } else {
        const int ctop = top + (tbar ? 4 : 8);
        txt(clock_w / 2 - 6, ctop, id(f32), id(c_amber), TextAlign::TOP_CENTER, hm);
        txt(clock_w - 2, top + 3, id(f8), id(c_dim), TextAlign::TOP_RIGHT, ampm);
        if (bot - top >= 48)
          txt(clock_w / 2, ctop + 30, id(f8), id(c_dim), TextAlign::TOP_CENTER, now.strftime("%a %b %d"));
      }
      if (!wide) return;

      // Third panel: rotating cards, 8 s each. Weather always; tomorrow's
      // forecast after 7 PM; the Bears preview on game day before kickoff;
      // trash the night before pickup until the bins are out.
      const int cx = 160;
      enum { C_WX, C_TMRW, C_BEARS, C_TRASH };
      int cards[4], n = 0;
      cards[n++] = C_WX;
      if (now.hour >= 19 && id(tm_code) >= 0 && !std::isnan(id(ha_tm_hi).state)) cards[n++] = C_TMRW;
      if (gs == "pre") cards[n++] = C_BEARS;
      if (id(ha_trash).state) cards[n++] = C_TRASH;
      const int card = cards[(millis() / 8000) % n];
      const bool full = !tbar && !strip;

      if (card == C_TRASH) {
        if (full) {
          // Trash can: lid, handle, ribbed body.
          const Color can(60, 160, 90), rib(30, 90, 50);
          it.filled_rectangle(cx - 3, 4, 7, 2, can);
          it.filled_rectangle(cx - 11, 6, 23, 3, can);
          it.filled_rectangle(cx - 9, 10, 19, 22, can);
          for (int x = cx - 5; x <= cx + 5; x += 5) it.filled_rectangle(x, 13, 1, 16, rib);
          txt(cx, 40, id(f8), id(c_white), TextAlign::TOP_CENTER, "TRASH");
          txt(cx, 52, id(f8), id(c_amber), TextAlign::TOP_CENTER, "TOMORROW");
        } else {
          txt(cx, top + 4, id(f8), id(c_white), TextAlign::TOP_CENTER, "TRASH");
          txt(cx, top + 16, id(f8), id(c_amber), TextAlign::TOP_CENTER, "TOMORROW");
        }
        return;
      }
      if (card == C_TMRW) {
        char hl[16];
        snprintf(hl, sizeof hl, "%.0f/%.0f", id(ha_tm_hi).state, id(ha_tm_lo).state);
        txt(cx, top + 2, id(f8), id(c_dim), TextAlign::TOP_CENTER, "TOMORROW");
        if (full) {
          wx_icon(cx, 8, id(tm_code), 1, 26);
          txt(cx, 40, id(f8), id(c_white), TextAlign::TOP_CENTER, id(tm_label));
          txt(cx, 52, id(f8), id(c_amber), TextAlign::TOP_CENTER, hl);
        } else {
          txt(cx, top + 13, id(f8), id(c_white), TextAlign::TOP_CENTER, id(tm_label));
          txt(cx, top + 24, id(f8), id(c_amber), TextAlign::TOP_CENTER, hl);
        }
        return;
      }
      if (card == C_BEARS) {
        it.filled_rectangle(129, top, W - 129, bot - top, hexc(id(g_us_c), 60));
        const int t0 = top + (tbar ? 3 : 4);
        txt(cx, t0, id(f8), hexc(id(g_us_a), 255), TextAlign::TOP_CENTER, id(g_home) ? "BEARS VS" : "BEARS AT");
        txt(cx, t0 + 11, id(f16), id(c_white), TextAlign::TOP_CENTER, id(g_opp));
        txt(cx, t0 + (tbar ? 27 : 32), id(f8), id(c_amber), TextAlign::TOP_CENTER, id(g_kick));
        if (!tbar) txt(cx, 50, id(f8), id(c_dim), TextAlign::TOP_CENTER, id(g_channel));
        return;
      }
      if (!have_wx) {
        it.print(cx, (top + bot) / 2, id(f8), id(c_dim), TextAlign::CENTER, "NO WX");
        return;
      }
      // Small dim dot in the corner when the weather is more than 3 hours old.
      if (id(wx_ts) > 0 && ts - id(wx_ts) > 3 * 3600) it.filled_rectangle(W - 3, top + 1, 2, 2, id(c_gray));
      if (!tbar && !strip && code == 2) {
        // Partly cloudy has nothing falling below the cloud, so the temperature
        // moves up and the label gets two lines.
        wx_icon(cx, 0, code, id(wx_lvl), 20);
        txt(cx, 21, id(f16), id(c_white), TextAlign::TOP_CENTER, temp);
        txt(cx, 35, id(f8), id(c_white), TextAlign::TOP_CENTER, "PARTLY");
        txt(cx, 43, id(f8), id(c_white), TextAlign::TOP_CENTER, "CLOUDY");
        if (!std::isnan(id(wx_hi))) {
          char hl[16];
          snprintf(hl, sizeof hl, "%.0f/%.0f", id(wx_hi), id(wx_lo));
          txt(cx, 55, id(f8), id(c_dim), TextAlign::TOP_CENTER, hl);
        }
      } else if (!tbar && !strip) {
        wx_icon(cx, 0, code, id(wx_lvl), 28);
        it.printf(cx, 38, id(f16), id(c_white), TextAlign::CENTER, "%s", temp);
        it.print(cx, 51, id(f8), id(c_white), TextAlign::CENTER, id(wx_label).c_str());
        if (!std::isnan(id(wx_hi)))
          it.printf(cx, 60, id(f8), id(c_dim), TextAlign::CENTER, "%.0f/%.0f", id(wx_hi), id(wx_lo));
      } else if (bot - top >= 48) {
        wx_icon(cx, top, code, id(wx_lvl), 20);
        txt(cx, top + 22, id(f16), id(c_white), TextAlign::TOP_CENTER, temp);
        txt(cx, top + 38, id(f8), id(c_white), TextAlign::TOP_CENTER, id(wx_label));
      } else {
        txt(cx, top + 4, id(f16), id(c_white), TextAlign::TOP_CENTER, temp);
        txt(cx, top + 22, id(f8), id(c_white), TextAlign::TOP_CENTER, id(wx_label));
      }

# LED Sign: 64x64 P3 panels on an Adafruit Matrix Portal S3.
# Chain: Matrix Portal -> panel 1 IN, panel 1 OUT -> panel 2 IN -> panel 2 OUT -> panel 3 IN.
# Panels get 5V from the MEAN WELL through their own red/black leads; leave
# the Matrix Portal's screw terminals empty while it's on USB-C.
#
# The sign runs its own logic: clock (network time) and weather (Open-Meteo)
# are fetched on the device. Home Assistant only controls it and pushes things
# that live in HA, through these actions:
#   esphome.led_sign_show_message  line1, line2, seconds
#   esphome.led_sign_show_timer    label, remaining, duration   (seconds)
#   esphome.led_sign_clear_timer
#   esphome.led_sign_show_now_playing   title, artist, source, art_url
#   esphome.led_sign_clear_now_playing
# Screen priority: timer > message > Amtrak passing > plane overhead >
# now playing > idle (clock + weather).
#
# Amtrak: the sign polls api.amtraker.com for the trains that pass the house
# (Southwest Chief 3/4, California Zephyr 5/6, Illinois Zephyr / Carl Sandburg
# 380-383) and estimates when each passes the yard by interpolating between
# its Chicago Union Station time and its next/previous stop (La Grange Road or
# Naperville), by track mileage. "Train offset" and "Train window" in HA tune it.
#
# Planes: the sign polls adsb.lol (free, no key) every 10 s for aircraft near
# home_lat/home_lon, picks the closest one inside the radius/altitude limits
# (adjustable in HA) and looks up its route on adsbdb.com.

substitutions:
  panels: "2"          # change to "3" when the third panel is connected
  latitude: "41.83"    # weather location (city level is enough)
  longitude: "-87.81"
  home_lat: "41.83"    # exact home position for "overhead" (set precisely in ESPHome)
  home_lon: "-87.81"
  yard_mp: "10.1"      # house position, BNSF miles from Chicago Union Station

esphome:
  name: led-sign
  friendly_name: LED Sign
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
          else:
            - hub75.set_brightness:
                id: sign
                brightness: 0

esp32:
  board: adafruit_matrixportal_esp32s3

psram:
  mode: quad

logger:

api:
  actions:
    - action: show_message
      variables:
        line1: string
        line2: string
        seconds: int
      then:
        - lambda: |-
            id(msg_line1) = line1;
            id(msg_line2) = line2;
            id(msg_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 30);
    - action: show_timer
      variables:
        label: string
        remaining: int
        duration: int
      then:
        - lambda: |-
            id(timer_label) = label.empty() ? std::string("TIMER") : label;
            id(timer_end) = id(sntp_time).now().timestamp + remaining;
            id(timer_duration) = duration > 0 ? duration : remaining;
    - action: clear_timer
      then:
        - lambda: 'id(timer_end) = 0;'
    - action: show_now_playing
      variables:
        title: string
        artist: string
        source: string
        art_url: string
      then:
        - lambda: |-
            id(np_title) = title;
            id(np_artist) = artist;
            id(np_source) = source;
            id(np_active) = true;
        - if:
            condition:
              lambda: 'return art_url != id(np_art_url);'
            then:
              - lambda: |-
                  id(np_art_url) = art_url;
                  id(np_art_ok) = false;
              - if:
                  condition:
                    lambda: 'return !art_url.empty();'
                  then:
                    - online_image.set_url:
                        id: album_art
                        url: !lambda 'return art_url;'
                    - component.update: album_art
    - action: clear_now_playing
      then:
        - lambda: 'id(np_active) = false;'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - delay: 5s
    - script.execute: fetch_weather

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago

http_request:
  timeout: 10s

globals:
  - id: wx_temp
    type: float
    initial_value: 'NAN'
  - id: wx_hi
    type: float
    initial_value: 'NAN'
  - id: wx_lo
    type: float
    initial_value: 'NAN'
  - id: wx_code
    type: int
    initial_value: '-1'
  - id: msg_line1
    type: std::string
  - id: msg_line2
    type: std::string
  - id: msg_until
    type: int64_t
    initial_value: '0'
  - id: timer_label
    type: std::string
  - id: timer_end
    type: int64_t
    initial_value: '0'
  - id: timer_duration
    type: int
    initial_value: '0'
  # Closest qualifying aircraft
  - id: pl_flight
    type: std::string
  - id: pl_type
    type: std::string
  - id: pl_reg
    type: std::string
  - id: pl_alt
    type: int
    initial_value: '0'
  - id: pl_rate
    type: int
    initial_value: '0'
  - id: pl_gs
    type: float
    initial_value: '0'
  - id: pl_track
    type: float
    initial_value: '0'
  - id: pl_dx          # miles east of home
    type: float
    initial_value: '0'
  - id: pl_dy          # miles north of home
    type: float
    initial_value: '0'
  - id: pl_last_seen
    type: int64_t
    initial_value: '0'
  - id: pl_trail
    type: std::vector<std::pair<float, float>>
  - id: pl_route
    type: std::string
  - id: pl_airline
    type: std::string
  - id: pl_route_for
    type: std::string
  # Amtrak, one slot per train number in amtk_nums (filled in by fetch_amtrak)
  - id: amtk_nums
    type: std::vector<int>
    initial_value: '{3, 4, 5, 6, 380, 381, 382, 383}'
  - id: amtk_pass        # estimated pass time at the yard (epoch s), 0 = none
    type: std::vector<int64_t>
    initial_value: 'std::vector<int64_t>(8, 0)'
  - id: amtk_late        # minutes late at the yard (negative = early)
    type: std::vector<int>
    initial_value: 'std::vector<int>(8, 0)'
  - id: amtk_west        # true = westbound (leaving Chicago)
    type: std::vector<bool>
    initial_value: 'std::vector<bool>(8, false)'
  - id: amtk_dest
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(8)'
  - id: amtk_name
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(8)'
  - id: amtk_fetched     # when each slot was last refreshed
    type: std::vector<int64_t>
    initial_value: 'std::vector<int64_t>(8, 0)'
  - id: amtk_rr          # round-robin position
    type: int
    initial_value: '0'
  - id: amtk_slot        # slot being fetched
    type: int
    initial_value: '0'
  # Now playing (pushed from HA)
  - id: np_active
    type: bool
    initial_value: 'false'
  - id: np_title
    type: std::string
  - id: np_artist
    type: std::string
  - id: np_source
    type: std::string
  - id: np_art_url
    type: std::string
  - id: np_art_ok
    type: bool
    initial_value: 'false'

script:
  - id: fetch_weather
    mode: single
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1"
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code == 200;'
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          id(wx_temp) = root["current"]["temperature_2m"].as<float>();
                          id(wx_code) = root["current"]["weather_code"].as<int>();
                          id(wx_hi) = root["daily"]["temperature_2m_max"][0].as<float>();
                          id(wx_lo) = root["daily"]["temperature_2m_min"][0].as<float>();
                          return true;
                        });
                  else:
                    - logger.log:
                        format: "Weather request failed: HTTP %d"
                        args: ['response->status_code']
          on_error:
            then:
              - logger.log: "Weather request failed"

  - id: fetch_planes
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            // adsb.lol takes the radius in nautical miles; ask a bit wider than the limit.
            char url[128];
            snprintf(url, sizeof(url), "https://api.adsb.lol/v2/point/%s/%s/%.1f",
                     "${home_lat}", "${home_lon}", id(plane_radius).state * 0.869f + 1.0f);
            return std::string(url);
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code == 200;'
                  then:
                    - lambda: |-
                        const float hlat = ${home_lat}, hlon = ${home_lon};
                        const float kx = 69.17f * cosf(hlat * M_PI / 180.0f), ky = 69.05f;
                        const float radius = id(plane_radius).state;
                        const int max_alt = (int) id(plane_max_alt).state;
                        json::parse_json(body, [&](JsonObject root) -> bool {
                          float best = 1e9;
                          JsonObject pick;
                          for (JsonObject a : root["ac"].as<JsonArray>()) {
                            if (!a["lat"].is<float>() || !a["alt_baro"].is<int>()) continue;  // "ground" is a string
                            int alt = a["alt_baro"].as<int>();
                            if (alt > max_alt) continue;
                            float dx = (a["lon"].as<float>() - hlon) * kx;
                            float dy = (a["lat"].as<float>() - hlat) * ky;
                            float d = sqrtf(dx * dx + dy * dy);
                            if (d <= radius && d < best) { best = d; pick = a; }
                          }
                          if (pick.isNull()) return true;
                          std::string flight = pick["flight"] | "";
                          while (!flight.empty() && flight.back() == ' ') flight.pop_back();
                          std::string reg = pick["r"] | "";
                          if (flight.empty()) flight = reg.empty() ? std::string(pick["hex"] | "?") : reg;
                          if (flight != id(pl_flight)) {
                            id(pl_trail).clear();
                            id(pl_route).clear();
                            id(pl_airline).clear();
                            id(overhead_flight).publish_state(flight);
                          }
                          id(pl_flight) = flight;
                          id(pl_reg) = reg;
                          id(pl_type) = pick["t"] | "";
                          id(pl_alt) = pick["alt_baro"].as<int>();
                          id(pl_rate) = pick["baro_rate"] | 0;
                          id(pl_gs) = pick["gs"] | 0.0f;
                          id(pl_track) = pick["track"] | 0.0f;
                          id(pl_dx) = (pick["lon"].as<float>() - hlon) * kx;
                          id(pl_dy) = (pick["lat"].as<float>() - hlat) * ky;
                          id(pl_trail).push_back({id(pl_dx), id(pl_dy)});
                          if (id(pl_trail).size() > 8) id(pl_trail).erase(id(pl_trail).begin());
                          id(pl_last_seen) = id(sntp_time).now().timestamp;
                          return true;
                        });
                        if (id(pl_route_for) != id(pl_flight) && !id(pl_flight).empty())
                          id(fetch_route).execute();
          on_error:
            then:
              - logger.log: "Plane request failed"

  - id: fetch_route
    mode: single
    then:
      - lambda: 'id(pl_route_for) = id(pl_flight);'
      - delay: 200ms   # let the plane request finish before starting the next one
      - http_request.get:
          url: !lambda 'return "https://api.adsbdb.com/v0/callsign/" + id(pl_route_for);'
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    JsonObject fr = root["response"]["flightroute"];
                    if (fr.isNull()) return true;
                    std::string from = fr["origin"]["iata_code"] | "";
                    std::string to = fr["destination"]["iata_code"] | "";
                    if (!from.empty() && !to.empty()) id(pl_route) = from + " > " + to;
                    std::string airline = fr["airline"]["name"] | "";
                    if (airline.size() > 18) airline.resize(18);
                    id(pl_airline) = airline;
                    return true;
                  });

  - id: fetch_amtrak
    mode: single
    then:
      - http_request.get:
          url: !lambda 'return "https://api.amtraker.com/v3/trains/" + std::to_string(id(amtk_nums)[id(amtk_slot)]);'
          capture_response: true
          max_response_buffer_size: 65536
          on_response:
            then:
              - lambda: |-
                  const int slot = id(amtk_slot);
                  const int64_t now = id(sntp_time).now().timestamp;
                  id(amtk_fetched)[slot] = now;
                  if (response->status_code != 200) {
                    ESP_LOGW("amtrak", "Train %d: HTTP %d", id(amtk_nums)[slot], response->status_code);
                    return;
                  }
                  // ISO 8601 with offset (2026-10-31T14:05:00-05:00) -> epoch seconds.
                  auto iso = [](const char *s) -> int64_t {
                    int Y, M, D, h, m, sec;
                    if (s == nullptr || sscanf(s, "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &m, &sec) != 6) return 0;
                    const char *tz = s + 19;
                    while (*tz == '.' || isdigit((unsigned char) *tz)) tz++;
                    int oh = 0, om = 0;
                    if (*tz == '+' || *tz == '-') sscanf(tz + 1, "%d:%d", &oh, &om);
                    int off = (oh * 3600 + om * 60) * (*tz == '-' ? -1 : 1);
                    Y -= M <= 2;
                    const int era = (Y >= 0 ? Y : Y - 399) / 400;
                    const unsigned yoe = Y - era * 400;
                    const unsigned doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
                    const unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                    const int64_t days = (int64_t) era * 146097 + doe - 719468;
                    return days * 86400 + h * 3600 + m * 60 + sec - off;
                  };
                  // Station mileposts on the BNSF from Chicago Union Station.
                  auto mp = [](const std::string &c) -> float {
                    if (c == "CHI") return 0.0f;
                    if (c == "LAG") return 13.4f;
                    if (c == "NPV") return 28.4f;
                    return -1.0f;
                  };
                  const float yard = ${yard_mp};
                  int64_t best = 0;
                  int best_late = 0;
                  bool best_west = false;
                  std::string best_dest, best_name;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    for (JsonPair kv : root) {
                      for (JsonObject tr : kv.value().as<JsonArray>()) {
                        JsonArray st = tr["stations"];
                        const int n = st.size();
                        int chi = -1;
                        for (int i = 0; i < n; i++)
                          if (strcmp(st[i]["code"] | "", "CHI") == 0) { chi = i; break; }
                        if (chi < 0 || n < 2) continue;
                        const bool west = chi == 0;
                        JsonObject a = west ? st[0].as<JsonObject>() : st[chi - 1].as<JsonObject>();
                        JsonObject b = west ? st[1].as<JsonObject>() : st[chi].as<JsonObject>();
                        const float mpa = mp(a["code"] | ""), mpb = mp(b["code"] | "");
                        if (mpa < 0 || mpb < 0 || mpa == mpb) continue;
                        const float f = (yard - mpa) / (mpb - mpa);
                        int64_t ta = iso(a["dep"] | ""), tb = iso(b["arr"] | "");
                        const int64_t sa = iso(a["schDep"] | ""), sb = iso(b["schArr"] | "");
                        if (ta == 0) ta = sa;
                        if (tb == 0) tb = iso(b["dep"] | "");
                        if (tb == 0) tb = sb;
                        if (ta == 0 || tb == 0 || sa == 0 || sb == 0) continue;
                        const int64_t pass = ta + (int64_t) (f * (tb - ta));
                        const int64_t sched = sa + (int64_t) (f * (sb - sa));
                        if (pass < now - 600) continue;           // already went by
                        if (best == 0 || pass < best) {
                          best = pass;
                          best_late = (int) lroundf((pass - sched) / 60.0f);
                          best_west = west;
                          best_dest = tr["destName"] | "";
                          best_name = tr["routeName"] | "";
                        }
                      }
                    }
                    return true;
                  });
                  id(amtk_pass)[slot] = best;
                  id(amtk_late)[slot] = best_late;
                  id(amtk_west)[slot] = best_west;
                  id(amtk_dest)[slot] = best_dest;
                  // Short route names that fit the sign.
                  const std::string &r = best_name;
                  id(amtk_name)[slot] = r.find("California") != std::string::npos ? "CA ZEPHYR"
                                      : r.find("Southwest") != std::string::npos ? "SW CHIEF"
                                      : r.find("Illinois") != std::string::npos ? "IL ZEPHYR"
                                      : r.find("Sandburg") != std::string::npos ? "CARL SANDBURG"
                                      : "AMTRAK";
                  // Tell HA which Amtrak passes next.
                  int64_t next = 0;
                  int ni = -1;
                  for (int i = 0; i < (int) id(amtk_pass).size(); i++) {
                    int64_t p = id(amtk_pass)[i];
                    if (p > now - 120 && (next == 0 || p < next)) { next = p; ni = i; }
                  }
                  if (ni >= 0) {
                    auto t = ESPTime::from_epoch_local(next + (int64_t) id(train_offset).state);
                    char buf[48];
                    snprintf(buf, sizeof(buf), "#%d %s %d:%02d%s", id(amtk_nums)[ni],
                             id(amtk_west)[ni] ? "WB" : "EB", t.hour % 12 == 0 ? 12 : t.hour % 12,
                             t.minute, t.hour < 12 ? "AM" : "PM");
                    if (id(next_amtrak).state != buf) id(next_amtrak).publish_state(buf);
                  }
          on_error:
            then:
              - logger.log: "Amtrak request failed"

interval:
  - interval: 30s
    then:
      - lambda: |-
          // Refresh a train that passes within 15 min every 30 s; otherwise
          // walk through all trains (each one about every 4 min).
          const int64_t now = id(sntp_time).now().timestamp;
          if (now < 1600000000) return;
          int pick = -1;
          int64_t soonest = 0;
          for (int i = 0; i < (int) id(amtk_pass).size(); i++) {
            int64_t p = id(amtk_pass)[i];
            if (p > now - 180 && p < now + 900 && (pick < 0 || p < soonest)) { pick = i; soonest = p; }
          }
          if (pick < 0) {
            pick = id(amtk_rr);
            id(amtk_rr) = (id(amtk_rr) + 1) % id(amtk_nums).size();
          }
          id(amtk_slot) = pick;
      - if:
          condition:
            switch.is_on: show_trains
          then:
            - script.execute: fetch_amtrak
  - interval: 15min
    then:
      - script.execute: fetch_weather
  - interval: 10s
    then:
      - if:
          condition:
            switch.is_on: show_planes
          then:
            - script.execute: fetch_planes
      - lambda: |-
          // Forget the plane 20 s after it was last inside the limits.
          if (id(pl_last_seen) > 0 && id(sntp_time).now().timestamp - id(pl_last_seen) > 20) {
            id(pl_last_seen) = 0;
            id(pl_flight).clear();
            id(pl_route_for).clear();
            id(overhead_flight).publish_state("none");
          }

switch:
  - platform: template
    name: "Display"
    id: display_on
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: sign
          brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
    turn_off_action:
      - hub75.set_brightness:
          id: sign
          brightness: 0
  - platform: template
    name: "Show planes"
    id: show_planes
    icon: mdi:airplane
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Show trains"
    id: show_trains
    icon: mdi:train
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (x * 255 / 100);'
  - platform: template
    name: "Plane radius"
    id: plane_radius
    icon: mdi:radius-outline
    unit_of_measurement: "mi"
    min_value: 0.25
    max_value: 5
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.5
  - platform: template
    name: "Plane max altitude"
    id: plane_max_alt
    icon: mdi:airplane-marker
    unit_of_measurement: "ft"
    min_value: 1000
    max_value: 40000
    step: 500
    optimistic: true
    restore_value: true
    initial_value: 10000
  - platform: template
    name: "Train offset"
    id: train_offset
    icon: mdi:timer-cog-outline
    unit_of_measurement: "s"
    min_value: -600
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Train window"
    id: train_window
    icon: mdi:arrow-expand-horizontal
    unit_of_measurement: "s"
    min_value: 15
    max_value: 600
    step: 15
    optimistic: true
    restore_value: true
    initial_value: 90

text_sensor:
  - platform: template
    name: "Overhead flight"
    id: overhead_flight
    icon: mdi:airplane
  - platform: template
    name: "Next Amtrak"
    id: next_amtrak
    icon: mdi:train

online_image:
  - id: album_art
    url: "http://localhost/none.jpg"   # replaced by show_now_playing
    format: JPEG
    type: RGB565
    resize: 64x64
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      - lambda: 'id(np_art_ok) = true;'
    on_error:
      - lambda: 'id(np_art_ok) = false;'

font:
  - file: "gfonts://Silkscreen"
    id: f8
    size: 8
  - file: "gfonts://Silkscreen"
    id: f16
    size: 16
  - file: "gfonts://Silkscreen"
    id: f32
    size: 32

color:
  - id: c_amber
    red_int: 255
    green_int: 176
    blue_int: 60
  - id: c_red
    red_int: 255
    green_int: 40
    blue_int: 30
  - id: c_white
    red_int: 235
    green_int: 225
    blue_int: 200
  - id: c_dim
    red_int: 150
    green_int: 120
    blue_int: 70
  - id: c_gray
    red_int: 70
    green_int: 70
    blue_int: 70
  - id: c_cyan
    red_int: 60
    green_int: 200
    blue_int: 255
  - id: c_green
    red_int: 40
    green_int: 230
    blue_int: 80

display:
  - platform: hub75
    id: sign
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 64
    layout_cols: ${panels}
    layout: HORIZONTAL
    bit_depth: 8
    brightness: 100
    double_buffer: true
    update_interval: 80ms   # fast enough for smooth text scrolling
    # Panels use FM6124 driver chips. If they stay dark, uncomment:
    # shift_driver: FM6124
    lambda: |-
      const int W = it.get_width();
      auto now = id(sntp_time).now();
      // Print text, scrolling it sideways when it doesn't fit between x0 and x1.
      auto marquee = [&](int x0, int x1, int y, display::BaseFont *f, Color c, const std::string &s) {
        int bx, by, w, h;
        it.get_text_bounds(0, y, s.c_str(), f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        if (w <= x1 - x0) {
          it.print(x0, y, f, c, TextAlign::TOP_LEFT, s.c_str());
          return;
        }
        const int gap = 24, off = (millis() / 40) % (w + gap);
        it.start_clipping(x0, y, x1, y + h + 2);
        it.print(x0 - off, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.print(x0 - off + w + gap, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.end_clipping();
      };
      if (!now.is_valid()) {
        it.print(W / 2, 32, id(f8), id(c_dim), TextAlign::CENTER, "CONNECTING...");
        return;
      }
      const int64_t ts = now.timestamp;

      // ---- Timer (highest priority) ----
      if (id(timer_end) > 0) {
        int64_t rem = id(timer_end) - ts;
        if (rem > 0) {
          it.print(W / 2, 0, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
          int h = rem / 3600, m = (rem % 3600) / 60, s = rem % 60;
          if (h > 0)
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d:%02d", h, m, s);
          else
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", m, s);
          if (id(timer_duration) > 0) {
            int bar = W - 32;
            int done = bar * (id(timer_duration) - rem) / id(timer_duration);
            it.filled_rectangle(16, 60, bar, 3, Color(60, 40, 10));
            it.filled_rectangle(16, 60, done, 3, id(c_amber));
          }
          return;
        }
        if (rem > -60) {
          // Flash "TIME'S UP" for a minute, then fall through to the next screen.
          if ((millis() / 500) % 2 == 0) {
            it.print(W / 2, 14, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
            it.print(W / 2, 40, id(f16), id(c_red), TextAlign::CENTER, "TIME'S UP");
          }
          return;
        }
        id(timer_end) = 0;
      }

      // ---- Message from Home Assistant ----
      if (id(msg_until) > ts) {
        it.print(W / 2, 22, id(f16), id(c_amber), TextAlign::CENTER, id(msg_line1).c_str());
        it.print(W / 2, 46, id(f8), id(c_white), TextAlign::CENTER, id(msg_line2).c_str());
        return;
      }

      // ---- Amtrak passing ----
      if (id(show_trains).state) {
        const int64_t win = (int64_t) id(train_window).state, offs = (int64_t) id(train_offset).state;
        int slot = -1;
        for (int i = 0; i < (int) id(amtk_pass).size(); i++) {
          int64_t p = id(amtk_pass)[i];
          if (p > 0 && ts >= p + offs - win && ts <= p + offs + win) { slot = i; break; }
        }
        if (slot >= 0) {
          const int num = id(amtk_nums)[slot];
          const bool wide = W >= 192;
          const int x0 = wide ? 70 : 2, xr = W - 2;
          if (wide) {
            // Amtrak-style locomotive nose: silver body, blue and red stripes.
            Color silver(170, 175, 185), blue(30, 80, 200), red(220, 30, 40);
            it.filled_rectangle(14, 16, 36, 30, silver);
            it.filled_rectangle(18, 20, 28, 9, Color(150, 200, 255));
            it.filled_rectangle(14, 34, 36, 3, blue);
            it.filled_rectangle(14, 38, 36, 2, red);
            it.filled_rectangle(17, 42, 4, 2, Color(255, 220, 60));
            it.filled_rectangle(43, 42, 4, 2, Color(255, 220, 60));
            it.print(32, 50, id(f8), id(c_red), TextAlign::TOP_CENTER, "AMTRAK");
            for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
          }
          marquee(x0, xr, 0, id(f16), id(c_amber), id(amtk_name)[slot]);
          it.printf(x0, 19, id(f8), id(c_white), TextAlign::TOP_LEFT, "#%d  %s", num,
                    id(amtk_west)[slot] ? "WESTBOUND" : "EASTBOUND");
          std::string dest = "TO " + id(amtk_dest)[slot];
          for (auto &ch : dest) ch = toupper(ch);
          marquee(x0, xr, 31, id(f8), id(c_white), dest);
          if ((millis() / 600) % 2 == 0)
            it.print(x0, 52, id(f8), id(c_red), TextAlign::TOP_LEFT, "PASSING");
          const int late = id(amtk_late)[slot];
          if (late > 1)
            it.printf(xr, 52, id(f8), id(c_red), TextAlign::TOP_RIGHT, "%d MIN LATE", late);
          else
            it.print(xr, 52, id(f8), id(c_green), TextAlign::TOP_RIGHT, "ON TIME");
          return;
        }
      }

      // ---- Plane overhead ----
      if (id(pl_last_seen) > 0 && !id(pl_flight).empty()) {
        const bool radar = W >= 192;
        const int x0 = radar ? 70 : 2, xr = W - 2;
        if (radar) {
          const int cx = 31, cy = 31;
          const float scale = 30.0f / id(plane_radius).state;
          Color ring(0, 70, 30);
          for (int r = 10; r <= 30; r += 10) it.circle(cx, cy, r, ring);
          for (auto &p : id(pl_trail))
            it.draw_pixel_at(cx + (int) (p.first * scale), cy - (int) (p.second * scale), Color(90, 90, 40));
          int px = cx + (int) (id(pl_dx) * scale), py = cy - (int) (id(pl_dy) * scale);
          float tr = id(pl_track) * M_PI / 180.0f;
          it.line(px, py, px + (int) (5 * sinf(tr)), py - (int) (5 * cosf(tr)), id(c_amber));
          it.filled_rectangle(px - 1, py - 1, 3, 3, id(c_amber));
          it.filled_rectangle(cx - 1, cy - 1, 3, 3, Color(40, 230, 80));   // home
          it.print(1, 63, id(f8), id(c_dim), TextAlign::BOTTOM_LEFT, "N");
          for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
        }
        it.print(x0, 0, id(f16), id(c_amber), TextAlign::TOP_LEFT, id(pl_flight).c_str());
        it.print(xr, 2, id(f8), id(c_amber), TextAlign::TOP_RIGHT, id(pl_type).c_str());
        const std::string &route = id(pl_route).empty() ? id(pl_reg) : id(pl_route);
        it.print(x0, 19, id(f16), id(c_white), TextAlign::TOP_LEFT, route.c_str());
        int alt = id(pl_alt);
        const char *arrow = id(pl_rate) > 300 ? " ^" : (id(pl_rate) < -300 ? " v" : "");
        if (alt >= 1000)
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d,%03d FT%s", alt / 1000, alt % 1000, arrow);
        else
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d FT%s", alt, arrow);
        it.printf(xr, 40, id(f8), id(c_cyan), TextAlign::TOP_RIGHT, "%.0f KT", id(pl_gs));
        it.print(x0, 52, id(f8), id(c_dim), TextAlign::TOP_LEFT, id(pl_airline).c_str());
        float d = sqrtf(id(pl_dx) * id(pl_dx) + id(pl_dy) * id(pl_dy));
        it.printf(xr, 52, id(f8), id(c_dim), TextAlign::TOP_RIGHT, "%.1f MI", d);
        return;
      }

      // ---- Now playing (kitchen) ----
      if (id(np_active)) {
        const bool wide = W >= 192;
        const int x0 = wide ? 70 : 2, xr = W - 2;
        if (wide) {
          if (id(np_art_ok)) {
            it.image(0, 0, id(album_art));
          } else {
            // Music note placeholder while the album art loads (or if there is none).
            it.filled_circle(24, 42, 7, id(c_amber));
            it.filled_circle(42, 38, 7, id(c_amber));
            it.filled_rectangle(29, 16, 3, 27, id(c_amber));
            it.filled_rectangle(47, 12, 3, 27, id(c_amber));
            it.filled_rectangle(29, 12, 21, 5, id(c_amber));
          }
        }
        it.print(x0, 2, id(f8), id(c_dim), TextAlign::TOP_LEFT, "NOW PLAYING");
        it.print(xr, 2, id(f8), id(c_dim), TextAlign::TOP_RIGHT, id(np_source).c_str());
        marquee(x0, xr, 17, id(f16), id(c_amber), id(np_title));
        marquee(x0, xr, 40, id(f8), id(c_white), id(np_artist));
        return;
      }

      // ---- Idle: clock + weather ----
      const bool wide = W >= 192;
      const int clock_w = wide ? 128 : W;
      int hour12 = now.hour % 12 == 0 ? 12 : now.hour % 12;
      it.printf(clock_w / 2 - 6, 26, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", hour12, now.minute);
      it.print(clock_w - 2, 8, id(f8), id(c_dim), TextAlign::TOP_RIGHT, now.hour < 12 ? "AM" : "PM");
      it.strftime(clock_w / 2, 54, id(f8), id(c_dim), TextAlign::CENTER, "%a %b %d", now);
      if (!wide) return;

      // Weather column on the third panel.
      const int cx = 160;
      for (int y = 0; y < 64; y += 2) it.draw_pixel_at(128, y, id(c_gray));
      int code = id(wx_code);
      if (code < 0 || std::isnan(id(wx_temp))) {
        it.print(cx, 32, id(f8), id(c_dim), TextAlign::CENTER, "NO WX");
        return;
      }
      const char *label;
      if (code == 0) label = "CLEAR";
      else if (code <= 2) label = "PARTLY";
      else if (code == 3) label = "CLOUDY";
      else if (code <= 48) label = "FOG";
      else if (code <= 57) label = "DRIZZLE";
      else if (code <= 67) label = "RAIN";
      else if (code <= 77) label = "SNOW";
      else if (code <= 82) label = "SHOWERS";
      else if (code <= 86) label = "SNOW";
      else label = "STORM";
      // Icon: sun for clear/partly, cloud for the rest, with rain/snow/bolt marks.
      Color sun(255, 200, 40), cloud(170, 170, 190);
      if (code <= 2) it.filled_circle(code == 0 ? cx : cx - 6, 10, 6, sun);
      if (code >= 1) {
        it.filled_circle(cx - 6, 12, 5, cloud);
        it.filled_circle(cx + 2, 9, 7, cloud);
        it.filled_circle(cx + 9, 13, 4, cloud);
        it.filled_rectangle(cx - 6, 13, 15, 5, cloud);
      }
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
        for (int i = -6; i <= 6; i += 4) it.line(cx + i, 20, cx + i - 2, 24, Color(60, 140, 255));
      if ((code >= 71 && code <= 77) || code == 85 || code == 86)
        for (int i = -6; i <= 6; i += 4) it.draw_pixel_at(cx + i, 22, Color(255, 255, 255));
      if (code >= 95) it.line(cx + 1, 19, cx - 2, 25, sun);
      it.printf(cx, 38, id(f16), id(c_white), TextAlign::CENTER, "%.0fF", id(wx_temp));
      it.print(cx, 51, id(f8), id(c_white), TextAlign::CENTER, label);
      if (!std::isnan(id(wx_hi)))
        it.printf(cx, 60, id(f8), id(c_dim), TextAlign::CENTER, "%.0f/%.0f", id(wx_hi), id(wx_lo));

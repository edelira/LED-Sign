# LED Sign: 64x64 P3 panels on an Adafruit Matrix Portal S3.
# Chain: Matrix Portal -> panel 1 IN, panel 1 OUT -> panel 2 IN -> panel 2 OUT -> panel 3 IN.
# Panels get 5V from the MEAN WELL through their own red/black leads; leave
# the Matrix Portal's screw terminals empty while it's on USB-C.
#
# The sign only draws. Home Assistant (packages/led_sign.yaml in the HA repo)
# fetches weather, planes and Amtrak, does the math, and pushes results here.
# The clock comes from network time with Home Assistant as a backup.
#
# Actions HA calls (esphome.led_sign_<name>):
#   show_message      line1, line2, seconds
#   show_timer        label, remaining, duration   (seconds)
#   clear_timer
#   show_train        company, name, train_number, westbound, dest, late, seconds
#   show_plane        flight, aircraft, route, airline, altitude, rate, speed,
#                     track, dx, dy, radius        (dx/dy/radius in miles)
#   clear_plane
#   show_now_playing  title, artist, source, art_url
#   clear_now_playing
# Screen priority: timer > message > train passing > plane overhead >
# now playing > idle (clock + weather).

substitutions:
  panels: "3"          # panels chained left to right

esphome:
  name: led-sign
  friendly_name: LED Sign
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
          else:
            - hub75.set_brightness:
                id: sign
                brightness: 0

esp32:
  board: adafruit_matrixportal_esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # The three panels' DMA buffers take most of the internal RAM; keep
      # TLS and Wi-Fi buffers in PSRAM.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: quad

logger:

api:
  actions:
    - action: show_message
      variables:
        line1: string
        line2: string
        seconds: int
      then:
        - lambda: |-
            id(msg_line1) = line1;
            id(msg_line2) = line2;
            id(msg_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 30);
    - action: show_timer
      variables:
        label: string
        remaining: int
        duration: int
      then:
        - lambda: |-
            id(timer_label) = label.empty() ? std::string("TIMER") : label;
            id(timer_end) = id(sntp_time).now().timestamp + remaining;
            id(timer_duration) = duration > 0 ? duration : remaining;
    - action: clear_timer
      then:
        - lambda: 'id(timer_end) = 0;'
    - action: show_train
      variables:
        company: string
        name: string
        train_number: int
        westbound: bool
        dest: string
        late: int
        seconds: int
      then:
        - lambda: |-
            // A new train (not a refresh of the one showing) restarts the
            // full-width entrance animation.
            if (id(tr_until) <= id(sntp_time).now().timestamp || train_number != id(tr_number))
              id(tr_start) = millis();
            id(tr_operator) = company;
            id(tr_name) = name;
            id(tr_number) = train_number;
            id(tr_west) = westbound;
            id(tr_dest) = dest;
            id(tr_late) = late;
            id(tr_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 60);
    - action: show_plane
      variables:
        flight: string
        aircraft: string
        route: string
        airline: string
        altitude: int
        rate: int
        speed: float
        track: float
        dx: float
        dy: float
        radius: float
      then:
        - lambda: |-
            if (flight != id(pl_flight)) id(pl_trail).clear();
            id(pl_flight) = flight;
            id(pl_type) = aircraft;
            id(pl_route) = route;
            id(pl_airline) = airline;
            id(pl_alt) = altitude;
            id(pl_rate) = rate;
            id(pl_gs) = speed;
            id(pl_track) = track;
            id(pl_dx) = dx;
            id(pl_dy) = dy;
            id(pl_radius) = radius > 0 ? radius : 1.5f;
            id(pl_trail).push_back({dx, dy});
            if (id(pl_trail).size() > 8) id(pl_trail).erase(id(pl_trail).begin());
            id(pl_last_seen) = id(sntp_time).now().timestamp;
    - action: clear_plane
      then:
        - lambda: |-
            id(pl_last_seen) = 0;
            id(pl_flight).clear();
    - action: show_now_playing
      variables:
        title: string
        artist: string
        source: string
        art_url: string
      then:
        - lambda: |-
            id(np_title) = title;
            id(np_artist) = artist;
            id(np_source) = source;
            id(np_active) = true;
        - if:
            condition:
              lambda: 'return art_url != id(np_art_url);'
            then:
              - lambda: |-
                  id(np_art_url) = art_url;
                  id(np_art_ok) = false;
              - if:
                  condition:
                    lambda: 'return !art_url.empty();'
                  then:
                    - online_image.set_url:
                        id: album_art
                        url: !lambda 'return art_url;'
                    - component.update: album_art
    - action: clear_now_playing
      then:
        - lambda: 'id(np_active) = false;'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Both sources set the same system clock, so the sign keeps time if either the
# internet (NTP) or Home Assistant is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
  - platform: homeassistant
    timezone: America/Chicago

# Only used to download album art from Home Assistant.
http_request:
  timeout: 4s

debug:
  update_interval: 60s

globals:
  - id: wx_temp
    type: float
    initial_value: 'NAN'
  - id: wx_hi
    type: float
    initial_value: 'NAN'
  - id: wx_lo
    type: float
    initial_value: 'NAN'
  - id: wx_code        # WMO-style code that picks the icon, -1 = no weather yet
    type: int
    initial_value: '-1'
  - id: wx_label
    type: std::string
  - id: msg_line1
    type: std::string
  - id: msg_line2
    type: std::string
  - id: msg_until
    type: int64_t
    initial_value: '0'
  - id: timer_label
    type: std::string
  - id: timer_end
    type: int64_t
    initial_value: '0'
  - id: timer_duration
    type: int
    initial_value: '0'
  # Plane overhead (pushed from HA)
  - id: pl_flight
    type: std::string
  - id: pl_type
    type: std::string
  - id: pl_route
    type: std::string
  - id: pl_airline
    type: std::string
  - id: pl_alt
    type: int
    initial_value: '0'
  - id: pl_rate
    type: int
    initial_value: '0'
  - id: pl_gs
    type: float
    initial_value: '0'
  - id: pl_track
    type: float
    initial_value: '0'
  - id: pl_dx          # miles east of home
    type: float
    initial_value: '0'
  - id: pl_dy          # miles north of home
    type: float
    initial_value: '0'
  - id: pl_radius      # radar scale (HA's plane radius), miles
    type: float
    initial_value: '1.5'
  - id: pl_last_seen
    type: int64_t
    initial_value: '0'
  - id: pl_trail
    type: std::vector<std::pair<float, float>>
  # Train passing (pushed from HA)
  - id: tr_operator
    type: std::string
  - id: tr_name
    type: std::string
  - id: tr_number
    type: int
    initial_value: '0'
  - id: tr_west
    type: bool
    initial_value: 'false'
  - id: tr_dest
    type: std::string
  - id: tr_late
    type: int
    initial_value: '0'
  - id: tr_until
    type: int64_t
    initial_value: '0'
  - id: tr_start       # millis() when the current train arrived (animation clock)
    type: uint32_t
    initial_value: '0'
  # Now playing (pushed from HA)
  - id: np_active
    type: bool
    initial_value: 'false'
  - id: np_title
    type: std::string
  - id: np_artist
    type: std::string
  - id: np_source
    type: std::string
  - id: np_art_url
    type: std::string
  - id: np_art_ok
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    name: "Display"
    id: display_on
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: sign
          brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
    turn_off_action:
      - hub75.set_brightness:
          id: sign
          brightness: 0
  - platform: template
    name: "Show planes"
    id: show_planes
    icon: mdi:airplane
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Show trains"
    id: show_trains
    icon: mdi:train
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (x * 255 / 100);'

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "Free memory"
  # Weather from Home Assistant
  - platform: homeassistant
    id: ha_wx_temp
    entity_id: weather.forecast_home
    attribute: temperature
    internal: true
    on_value:
      - lambda: 'id(wx_temp) = x;'
  - platform: homeassistant
    id: ha_wx_hi
    entity_id: sensor.led_sign_today_high
    internal: true
    on_value:
      - lambda: 'id(wx_hi) = x;'
  - platform: homeassistant
    id: ha_wx_lo
    entity_id: sensor.led_sign_today_low
    internal: true
    on_value:
      - lambda: 'id(wx_lo) = x;'

text_sensor:
  - platform: homeassistant
    id: ha_wx_condition
    entity_id: weather.forecast_home
    internal: true
    on_value:
      - lambda: |-
          // HA weather condition -> label and icon code (codes follow the WMO
          // numbering the icon drawing uses).
          struct Wx { const char *ha, *label; int code; };
          static const Wx table[] = {
            {"sunny", "SUNNY", 0}, {"clear-night", "CLEAR", 0},
            {"partlycloudy", "PARTLY", 2}, {"cloudy", "CLOUDY", 3},
            {"fog", "FOG", 45}, {"rainy", "RAIN", 61}, {"pouring", "POURING", 65},
            {"snowy", "SNOW", 71}, {"snowy-rainy", "SLEET", 67}, {"hail", "HAIL", 96},
            {"lightning", "STORM", 95}, {"lightning-rainy", "STORM", 95},
            {"windy", "WINDY", 3}, {"windy-variant", "WINDY", 3},
            {"exceptional", "ALERT", 3},
          };
          id(wx_code) = -1;
          for (const auto &w : table)
            if (x == w.ha) { id(wx_label) = w.label; id(wx_code) = w.code; break; }
  - platform: debug
    reset_reason:
      name: "Last restart reason"

image:
  - platform: online_image
    id: album_art
    url: "http://localhost/none.jpg"   # replaced by show_now_playing
    format: JPEG
    type: RGB565
    resize: 64x64
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      - lambda: 'id(np_art_ok) = true;'
    on_error:
      - lambda: 'id(np_art_ok) = false;'

font:
  - file: "gfonts://Silkscreen"
    id: f8
    size: 8
  - file: "gfonts://Silkscreen"
    id: f16
    size: 16
  - file: "gfonts://Silkscreen"
    id: f32
    size: 32

color:
  - id: c_amber
    red_int: 255
    green_int: 176
    blue_int: 60
  - id: c_red
    red_int: 255
    green_int: 40
    blue_int: 30
  - id: c_white
    red_int: 235
    green_int: 225
    blue_int: 200
  - id: c_dim
    red_int: 150
    green_int: 120
    blue_int: 70
  - id: c_gray
    red_int: 70
    green_int: 70
    blue_int: 70
  - id: c_cyan
    red_int: 60
    green_int: 200
    blue_int: 255
  - id: c_green
    red_int: 40
    green_int: 230
    blue_int: 80

# Redraw the screen every 80 ms (smooth scrolling), or every 40 ms (25 fps)
# while the train animation is on. The panels themselves refresh at
# min_refresh_rate.
interval:
  - interval: 40ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          bool animating = id(show_trains).state && id(tr_until) > id(sntp_time).now().timestamp;
          if (animating || ++tick % 2 == 0) id(sign).update();

display:
  - platform: hub75
    id: sign
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 64
    layout_cols: ${panels}
    layout: HORIZONTAL
    bit_depth: 8
    brightness: 100
    double_buffer: true
    # Redrawn by the interval above. With a fixed update_interval ESPHome
    # derives the panel refresh from it (~40 Hz), which flickers slightly.
    update_interval: never
    min_refresh_rate: 120
    # Hides faint green "ghost" streaks below bright pixels. (shift_driver:
    # FM6124 left the DMA uninitialised on this board; don't use it.)
    latch_blanking: 2
    lambda: |-
      const int W = it.get_width();
      auto now = id(sntp_time).now();
      // Print text, scrolling it sideways when it doesn't fit between x0 and x1.
      auto marquee = [&](int x0, int x1, int y, display::BaseFont *f, Color c, const std::string &s) {
        int bx, by, w, h;
        it.get_text_bounds(0, y, s.c_str(), f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        if (w <= x1 - x0) {
          it.print(x0, y, f, c, TextAlign::TOP_LEFT, s.c_str());
          return;
        }
        const int gap = 24, off = (millis() / 40) % (w + gap);
        it.start_clipping(x0, y, x1, y + h + 2);
        it.print(x0 - off, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.print(x0 - off + w + gap, y, f, c, TextAlign::TOP_LEFT, s.c_str());
        it.end_clipping();
      };
      if (!now.is_valid()) {
        it.print(W / 2, 32, id(f8), id(c_dim), TextAlign::CENTER, "CONNECTING...");
        return;
      }
      const int64_t ts = now.timestamp;

      // ---- Timer (highest priority) ----
      if (id(timer_end) > 0) {
        int64_t rem = id(timer_end) - ts;
        if (rem > 0) {
          it.print(W / 2, 0, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
          int h = rem / 3600, m = (rem % 3600) / 60, s = rem % 60;
          if (h > 0)
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d:%02d", h, m, s);
          else
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", m, s);
          if (id(timer_duration) > 0) {
            int bar = W - 32;
            int done = bar * (id(timer_duration) - rem) / id(timer_duration);
            it.filled_rectangle(16, 60, bar, 3, Color(60, 40, 10));
            it.filled_rectangle(16, 60, done, 3, id(c_amber));
          }
          return;
        }
        if (rem > -60) {
          // Flash "TIME'S UP" for a minute, then fall through to the next screen.
          if ((millis() / 500) % 2 == 0) {
            it.print(W / 2, 14, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
            it.print(W / 2, 40, id(f16), id(c_red), TextAlign::CENTER, "TIME'S UP");
          }
          return;
        }
        id(timer_end) = 0;
      }

      // ---- Message from Home Assistant ----
      if (id(msg_until) > ts) {
        it.print(W / 2, 22, id(f16), id(c_amber), TextAlign::CENTER, id(msg_line1).c_str());
        it.print(W / 2, 46, id(f8), id(c_white), TextAlign::CENTER, id(msg_line2).c_str());
        return;
      }

      // ---- Train passing ----
      if (id(show_trains).state && id(tr_until) > ts) {
        const bool wide = W >= 192;
        const int x0 = wide ? 70 : 2, xr = W - 2;
        const uint32_t el = millis() - id(tr_start);
        const bool left = id(tr_west);           // westbound runs right to left
        const float phase = el * 0.0225f;        // wheel spin

        // Colours by operator: Amtrak silver/blue/red, freight orange.
        Color body(170, 175, 185), st1(30, 80, 200), st2(220, 30, 40);
        if (id(tr_operator) == "FREIGHT") { body = Color(230, 100, 20); st1 = Color(20, 20, 20); st2 = Color(255, 200, 40); }
        const Color glass(110, 160, 230), dark(25, 30, 45), wheel(60, 60, 60);
        const Color rail(90, 90, 90), tie(60, 40, 25), lamp(255, 220, 60);

        // Drawing helpers, clipped by hand to [clip0, clip1).
        int clip0 = 0, clip1 = W;
        auto box = [&](int x, int y, int w, int h, Color c) {
          int a = std::max(x, clip0), b = std::min(x + w, clip1);
          int t = std::max(y, 0), u = std::min(y + h, 64);
          if (a < b && t < u) it.filled_rectangle(a, t, b - a, u - t, c);
        };
        auto wheels = [&](int x, int top, int L, int h) {
          int r = std::max(1, h / 8), y = top + h + r - 1;
          for (int cx : {x + 3 + r, x + 5 + 3 * r, x + L - 5 - 3 * r, x + L - 3 - r}) {
            for (int dy = -r; dy <= r; dy++) {
              int hw = (int) sqrtf(r * r + r - dy * dy);
              box(cx - hw, y + dy, 2 * hw + 1, 1, wheel);
            }
            box(cx + lroundf(r * 0.7f * cosf(phase)), y + lroundf(r * 0.7f * sinf(phase)), 1, 1, body);
          }
        };
        auto car = [&](int x, int top, int L, int h) {
          box(x + 1, top, L - 2, 1, body);
          box(x, top + 1, L, h - 1, body);
          int wy = top + std::max(2, h / 5), wh = std::max(2, h / 4), s = std::max(1, h / 8);
          for (int wx = x + 3; wx < x + L - 4; wx += std::max(4, h / 3)) box(wx, wy, std::max(2, h / 5), wh, glass);
          box(x, wy + wh + 1, L, s, st1);
          box(x, wy + wh + 1 + s, L, 1, st2);
          wheels(x, top, L, h);
        };
        auto loco = [&](int x, int top, int L, int h) {
          int nose = h / 2, s = std::max(1, h / 8);
          for (int i = 0; i < L; i++) {
            int d = left ? i : L - 1 - i;              // distance from the leading end
            int t = d < nose ? top + nose - d : top;   // sloped nose
            box(x + i, t, 1, top + h - t, body);
          }
          int cw = std::max(3, h / 3);
          box(left ? x + nose - 1 : x + L - nose - cw + 1, top + h / 4 + 1, cw, std::max(2, h / 4), dark);
          box(x, top + h * 3 / 5, L, s, st1);
          box(x, top + h * 3 / 5 + s, L, 1, st2);
          box(left ? x + 1 : x + L - 3, top + h - std::max(3, h / 4), 2, 2, lamp);
          wheels(x, top, L, h);
        };
        auto track = [&](int y) {
          box(clip0, y, clip1 - clip0, 1, rail);
          for (int x = clip0; x < clip1; x += 5) box(x, y + 1, 1, 1, tie);
        };

        // Entrance: a locomotive and three cars run across the whole sign.
        const int h = 24, top = 30, cars = 3, gap = 2;
        const int locoL = h * 12 / 5, carL = h * 29 / 10;
        const int trainL = locoL + cars * (carL + gap);
        const int run = (int) (el * 0.125f);     // 125 px/s
        if (wide && run < W + trainL) {
          std::string title = id(tr_operator);
          if (id(tr_number) > 0) title += "  #" + std::to_string(id(tr_number));
          it.print(W / 2, 2, id(f16), id(c_amber), TextAlign::TOP_CENTER, title.c_str());
          track(top + h + 5);
          // Leading end first: westbound enters from the right.
          int x = left ? W - run : run - trainL;
          if (left) {
            loco(x, top, locoL, h);
            for (int c = 0, cx = x + locoL + gap; c < cars; c++, cx += carL + gap) car(cx, top, carL, h);
          } else {
            int cx = x;
            for (int c = 0; c < cars; c++, cx += carL + gap) car(cx, top, carL, h);
            loco(cx, top, locoL, h);
          }
          return;
        }

        if (wide) {
          // Left panel: cars rolling past in the direction of travel.
          const int sh = 14, sL = sh * 29 / 10, step = sL + 2;
          clip0 = 0; clip1 = 64;
          track(41);
          int off = (int) (el * 0.05f) % step;
          for (int x = left ? -off : off - step; x < 64; x += step) car(x, 22, sL, sh);
          it.print(32, 50, id(f8), id(c_red), TextAlign::TOP_CENTER, id(tr_operator).c_str());
          for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
        }
        marquee(x0, xr, 0, id(f16), id(c_amber), id(tr_name));
        it.printf(x0, 19, id(f8), id(c_white), TextAlign::TOP_LEFT, "#%d  %s", id(tr_number),
                  id(tr_west) ? "WESTBOUND" : "EASTBOUND");
        std::string dest = "TO " + id(tr_dest);
        for (auto &ch : dest) ch = toupper(ch);
        marquee(x0, xr, 31, id(f8), id(c_white), dest);
        if ((millis() / 600) % 2 == 0)
          it.print(x0, 52, id(f8), id(c_red), TextAlign::TOP_LEFT, "PASSING");
        if (id(tr_late) > 1)
          it.printf(xr, 52, id(f8), id(c_red), TextAlign::TOP_RIGHT, "%d MIN LATE", id(tr_late));
        else
          it.print(xr, 52, id(f8), id(c_green), TextAlign::TOP_RIGHT, "ON TIME");
        return;
      }

      // ---- Plane overhead ----
      // HA updates every ~10 s while a plane is overhead; drop it if updates stop.
      if (id(show_planes).state && id(pl_last_seen) > 0 && ts - id(pl_last_seen) < 45 && !id(pl_flight).empty()) {
        const bool radar = W >= 192;
        const int x0 = radar ? 70 : 2, xr = W - 2;
        if (radar) {
          const int cx = 31, cy = 31;
          const float scale = 30.0f / id(pl_radius);
          Color ring(0, 70, 30);
          for (int r = 10; r <= 30; r += 10) it.circle(cx, cy, r, ring);
          for (auto &p : id(pl_trail))
            it.draw_pixel_at(cx + (int) (p.first * scale), cy - (int) (p.second * scale), Color(90, 90, 40));
          int px = cx + (int) (id(pl_dx) * scale), py = cy - (int) (id(pl_dy) * scale);
          float tr = id(pl_track) * M_PI / 180.0f;
          it.line(px, py, px + (int) (5 * sinf(tr)), py - (int) (5 * cosf(tr)), id(c_amber));
          it.filled_rectangle(px - 1, py - 1, 3, 3, id(c_amber));
          it.filled_rectangle(cx - 1, cy - 1, 3, 3, Color(40, 230, 80));   // home
          it.print(1, 63, id(f8), id(c_dim), TextAlign::BOTTOM_LEFT, "N");
          for (int y = 0; y < 64; y += 2) it.draw_pixel_at(64, y, id(c_gray));
        }
        it.print(x0, 0, id(f16), id(c_amber), TextAlign::TOP_LEFT, id(pl_flight).c_str());
        it.print(xr, 2, id(f8), id(c_amber), TextAlign::TOP_RIGHT, id(pl_type).c_str());
        it.print(x0, 19, id(f16), id(c_white), TextAlign::TOP_LEFT, id(pl_route).c_str());
        int alt = id(pl_alt);
        const char *arrow = id(pl_rate) > 300 ? " ^" : (id(pl_rate) < -300 ? " v" : "");
        if (alt >= 1000)
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d,%03d FT%s", alt / 1000, alt % 1000, arrow);
        else
          it.printf(x0, 40, id(f8), id(c_cyan), TextAlign::TOP_LEFT, "%d FT%s", alt, arrow);
        it.printf(xr, 40, id(f8), id(c_cyan), TextAlign::TOP_RIGHT, "%.0f KT", id(pl_gs));
        it.print(x0, 52, id(f8), id(c_dim), TextAlign::TOP_LEFT, id(pl_airline).c_str());
        float d = sqrtf(id(pl_dx) * id(pl_dx) + id(pl_dy) * id(pl_dy));
        it.printf(xr, 52, id(f8), id(c_dim), TextAlign::TOP_RIGHT, "%.1f MI", d);
        return;
      }

      // ---- Now playing (kitchen) ----
      if (id(np_active)) {
        const bool wide = W >= 192;
        const int x0 = wide ? 70 : 2, xr = W - 2;
        if (wide) {
          if (id(np_art_ok)) {
            it.image(0, 0, id(album_art));
          } else {
            // Music note placeholder while the album art loads (or if there is none).
            it.filled_circle(24, 42, 7, id(c_amber));
            it.filled_circle(42, 38, 7, id(c_amber));
            it.filled_rectangle(29, 16, 3, 27, id(c_amber));
            it.filled_rectangle(47, 12, 3, 27, id(c_amber));
            it.filled_rectangle(29, 12, 21, 5, id(c_amber));
          }
        }
        it.print(x0, 2, id(f8), id(c_dim), TextAlign::TOP_LEFT, "NOW PLAYING");
        it.print(xr, 2, id(f8), id(c_dim), TextAlign::TOP_RIGHT, id(np_source).c_str());
        marquee(x0, xr, 17, id(f16), id(c_amber), id(np_title));
        marquee(x0, xr, 40, id(f8), id(c_white), id(np_artist));
        return;
      }

      // ---- Idle: clock + weather ----
      const bool wide = W >= 192;
      const int clock_w = wide ? 128 : W;
      int hour12 = now.hour % 12 == 0 ? 12 : now.hour % 12;
      it.printf(clock_w / 2 - 6, 26, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", hour12, now.minute);
      it.print(clock_w - 2, 8, id(f8), id(c_dim), TextAlign::TOP_RIGHT, now.hour < 12 ? "AM" : "PM");
      it.strftime(clock_w / 2, 54, id(f8), id(c_dim), TextAlign::CENTER, "%a %b %d", now);
      if (!wide) return;

      // Weather column on the third panel.
      const int cx = 160;
      int code = id(wx_code);
      if (code < 0 || std::isnan(id(wx_temp))) {
        it.print(cx, 32, id(f8), id(c_dim), TextAlign::CENTER, "NO WX");
        return;
      }
      const char *label = id(wx_label).c_str();
      // Icon: sun for clear/partly, cloud for the rest, with rain/snow/bolt marks.
      Color sun(255, 200, 40), cloud(170, 170, 190);
      if (code <= 2) it.filled_circle(code == 0 ? cx : cx - 6, 10, 6, sun);
      if (code >= 1) {
        it.filled_circle(cx - 6, 12, 5, cloud);
        it.filled_circle(cx + 2, 9, 7, cloud);
        it.filled_circle(cx + 9, 13, 4, cloud);
        it.filled_rectangle(cx - 6, 13, 15, 5, cloud);
      }
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
        for (int i = -6; i <= 6; i += 4) it.line(cx + i, 20, cx + i - 2, 24, Color(60, 140, 255));
      if ((code >= 71 && code <= 77) || code == 85 || code == 86)
        for (int i = -6; i <= 6; i += 4) it.draw_pixel_at(cx + i, 22, Color(255, 255, 255));
      if (code >= 95) it.line(cx + 1, 19, cx - 2, 25, sun);
      it.printf(cx, 38, id(f16), id(c_white), TextAlign::CENTER, "%.0fF", id(wx_temp));
      it.print(cx, 51, id(f8), id(c_white), TextAlign::CENTER, label);
      if (!std::isnan(id(wx_hi)))
        it.printf(cx, 60, id(f8), id(c_dim), TextAlign::CENTER, "%.0f/%.0f", id(wx_hi), id(wx_lo));

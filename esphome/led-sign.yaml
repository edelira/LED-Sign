# LED Sign: 64x64 P3 panels on an Adafruit Matrix Portal S3.
# Chain: Matrix Portal -> panel 1 IN, panel 1 OUT -> panel 2 IN -> panel 2 OUT -> panel 3 IN.
# Panels get 5V from the MEAN WELL through their own red/black leads; leave
# the Matrix Portal's screw terminals empty while it's on USB-C.
#
# The sign runs its own logic: clock (network time) and weather (Open-Meteo)
# are fetched on the device. Home Assistant only controls it and pushes things
# that live in HA, through these actions:
#   esphome.led_sign_show_message  line1, line2, seconds
#   esphome.led_sign_show_timer    label, remaining, duration   (seconds)
#   esphome.led_sign_clear_timer
# Screen priority: timer > message > idle (clock + weather).

substitutions:
  panels: "2"          # change to "3" when the third panel is connected
  latitude: "41.83"    # weather location (city level is enough)
  longitude: "-87.81"

esphome:
  name: led-sign
  friendly_name: LED Sign
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
          else:
            - hub75.set_brightness:
                id: sign
                brightness: 0

esp32:
  board: adafruit_matrixportal_esp32s3

psram:
  mode: quad

logger:

api:
  actions:
    - action: show_message
      variables:
        line1: string
        line2: string
        seconds: int
      then:
        - lambda: |-
            id(msg_line1) = line1;
            id(msg_line2) = line2;
            id(msg_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 30);
    - action: show_timer
      variables:
        label: string
        remaining: int
        duration: int
      then:
        - lambda: |-
            id(timer_label) = label.empty() ? std::string("TIMER") : label;
            id(timer_end) = id(sntp_time).now().timestamp + remaining;
            id(timer_duration) = duration > 0 ? duration : remaining;
    - action: clear_timer
      then:
        - lambda: 'id(timer_end) = 0;'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - delay: 5s
    - script.execute: fetch_weather

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago

http_request:
  timeout: 10s

globals:
  - id: wx_temp
    type: float
    initial_value: 'NAN'
  - id: wx_hi
    type: float
    initial_value: 'NAN'
  - id: wx_lo
    type: float
    initial_value: 'NAN'
  - id: wx_code
    type: int
    initial_value: '-1'
  - id: msg_line1
    type: std::string
  - id: msg_line2
    type: std::string
  - id: msg_until
    type: int64_t
    initial_value: '0'
  - id: timer_label
    type: std::string
  - id: timer_end
    type: int64_t
    initial_value: '0'
  - id: timer_duration
    type: int
    initial_value: '0'

script:
  - id: fetch_weather
    mode: single
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1"
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code == 200;'
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          id(wx_temp) = root["current"]["temperature_2m"].as<float>();
                          id(wx_code) = root["current"]["weather_code"].as<int>();
                          id(wx_hi) = root["daily"]["temperature_2m_max"][0].as<float>();
                          id(wx_lo) = root["daily"]["temperature_2m_min"][0].as<float>();
                          return true;
                        });
                  else:
                    - logger.log:
                        format: "Weather request failed: HTTP %d"
                        args: ['response->status_code']
          on_error:
            then:
              - logger.log: "Weather request failed"

interval:
  - interval: 15min
    then:
      - script.execute: fetch_weather

switch:
  - platform: template
    name: "Display"
    id: display_on
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: sign
          brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
    turn_off_action:
      - hub75.set_brightness:
          id: sign
          brightness: 0

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (x * 255 / 100);'

font:
  - file: "gfonts://Silkscreen"
    id: f8
    size: 8
  - file: "gfonts://Silkscreen"
    id: f16
    size: 16
  - file: "gfonts://Silkscreen"
    id: f32
    size: 32

color:
  - id: c_amber
    red_int: 255
    green_int: 176
    blue_int: 60
  - id: c_red
    red_int: 255
    green_int: 40
    blue_int: 30
  - id: c_white
    red_int: 235
    green_int: 225
    blue_int: 200
  - id: c_dim
    red_int: 150
    green_int: 120
    blue_int: 70
  - id: c_gray
    red_int: 70
    green_int: 70
    blue_int: 70

display:
  - platform: hub75
    id: sign
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 64
    layout_cols: ${panels}
    layout: HORIZONTAL
    bit_depth: 8
    brightness: 100
    double_buffer: true
    update_interval: 250ms
    # Panels use FM6124 driver chips. If they stay dark, uncomment:
    # shift_driver: FM6124
    lambda: |-
      const int W = it.get_width();
      auto now = id(sntp_time).now();
      if (!now.is_valid()) {
        it.print(W / 2, 32, id(f8), id(c_dim), TextAlign::CENTER, "CONNECTING...");
        return;
      }
      const int64_t ts = now.timestamp;

      // ---- Timer (highest priority) ----
      if (id(timer_end) > 0) {
        int64_t rem = id(timer_end) - ts;
        if (rem > 0) {
          it.print(W / 2, 0, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
          int h = rem / 3600, m = (rem % 3600) / 60, s = rem % 60;
          if (h > 0)
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d:%02d", h, m, s);
          else
            it.printf(W / 2, 36, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", m, s);
          if (id(timer_duration) > 0) {
            int bar = W - 32;
            int done = bar * (id(timer_duration) - rem) / id(timer_duration);
            it.filled_rectangle(16, 60, bar, 3, Color(60, 40, 10));
            it.filled_rectangle(16, 60, done, 3, id(c_amber));
          }
          return;
        }
        if (rem > -60) {
          // Flash "TIME'S UP" for a minute, then fall through to the next screen.
          if ((millis() / 500) % 2 == 0) {
            it.print(W / 2, 14, id(f16), id(c_red), TextAlign::TOP_CENTER, id(timer_label).c_str());
            it.print(W / 2, 40, id(f16), id(c_red), TextAlign::CENTER, "TIME'S UP");
          }
          return;
        }
        id(timer_end) = 0;
      }

      // ---- Message from Home Assistant ----
      if (id(msg_until) > ts) {
        it.print(W / 2, 22, id(f16), id(c_amber), TextAlign::CENTER, id(msg_line1).c_str());
        it.print(W / 2, 46, id(f8), id(c_white), TextAlign::CENTER, id(msg_line2).c_str());
        return;
      }

      // ---- Idle: clock + weather ----
      const bool wide = W >= 192;
      const int clock_w = wide ? 128 : W;
      int hour12 = now.hour % 12 == 0 ? 12 : now.hour % 12;
      it.printf(clock_w / 2 - 6, 26, id(f32), id(c_amber), TextAlign::CENTER, "%d:%02d", hour12, now.minute);
      it.print(clock_w - 2, 8, id(f8), id(c_dim), TextAlign::TOP_RIGHT, now.hour < 12 ? "AM" : "PM");
      it.strftime(clock_w / 2, 54, id(f8), id(c_dim), TextAlign::CENTER, "%a %b %d", now);
      if (!wide) return;

      // Weather column on the third panel.
      const int cx = 160;
      for (int y = 0; y < 64; y += 2) it.draw_pixel_at(128, y, id(c_gray));
      int code = id(wx_code);
      if (code < 0 || std::isnan(id(wx_temp))) {
        it.print(cx, 32, id(f8), id(c_dim), TextAlign::CENTER, "NO WX");
        return;
      }
      const char *label;
      if (code == 0) label = "CLEAR";
      else if (code <= 2) label = "PARTLY";
      else if (code == 3) label = "CLOUDY";
      else if (code <= 48) label = "FOG";
      else if (code <= 57) label = "DRIZZLE";
      else if (code <= 67) label = "RAIN";
      else if (code <= 77) label = "SNOW";
      else if (code <= 82) label = "SHOWERS";
      else if (code <= 86) label = "SNOW";
      else label = "STORM";
      // Icon: sun for clear/partly, cloud for the rest, with rain/snow/bolt marks.
      Color sun(255, 200, 40), cloud(170, 170, 190);
      if (code <= 2) it.filled_circle(code == 0 ? cx : cx - 6, 10, 6, sun);
      if (code >= 1) {
        it.filled_circle(cx - 6, 12, 5, cloud);
        it.filled_circle(cx + 2, 9, 7, cloud);
        it.filled_circle(cx + 9, 13, 4, cloud);
        it.filled_rectangle(cx - 6, 13, 15, 5, cloud);
      }
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
        for (int i = -6; i <= 6; i += 4) it.line(cx + i, 20, cx + i - 2, 24, Color(60, 140, 255));
      if ((code >= 71 && code <= 77) || code == 85 || code == 86)
        for (int i = -6; i <= 6; i += 4) it.draw_pixel_at(cx + i, 22, Color(255, 255, 255));
      if (code >= 95) it.line(cx + 1, 19, cx - 2, 25, sun);
      it.printf(cx, 38, id(f16), id(c_white), TextAlign::CENTER, "%.0fF", id(wx_temp));
      it.print(cx, 51, id(f8), id(c_white), TextAlign::CENTER, label);
      if (!std::isnan(id(wx_hi)))
        it.printf(cx, 60, id(f8), id(c_dim), TextAlign::CENTER, "%.0f/%.0f", id(wx_hi), id(wx_lo));

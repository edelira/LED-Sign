# LED Sign: 64x64 P3 panels on an Adafruit Matrix Portal S3.
# Chain: Matrix Portal -> panel 1 IN, panel 1 OUT -> panel 2 IN -> panel 2 OUT -> panel 3 IN.
# Panels get 5V from the MEAN WELL through their own red/black leads; leave
# the Matrix Portal's screw terminals empty while it's on USB-C.
#
# The sign only draws. Home Assistant (packages/led_sign.yaml in the HA repo)
# fetches weather, planes and Amtrak, does the math, and pushes results here.
# The clock comes from network time with Home Assistant as a backup.
#
# Actions HA calls (esphome.led_sign_<name>):
#   show_message      line1, line2, seconds
#   show_timer        label, remaining, duration   (seconds)
#   clear_timer
#   show_train        company, name, train_number, westbound, dest, late, seconds
#   show_plane        flight, aircraft, route, airline, altitude, rate, speed,
#                     track, dx, dy, radius        (dx/dy/radius in miles)
#   clear_plane
#   show_now_playing  title, artist, source, art_url
#   clear_now_playing
#   show_game         game_state (pre/in/post), kickoff, opponent, at_home,
#                     us_score, opp_score, status, down_text, possession,
#                     channel, us_color, us_alt, opp_color, opp_alt
#   clear_game
#   show_leave        title, at, leave_ts, start_ts, drive, traffic
#                     (leave_ts/start_ts unix seconds, drive/traffic minutes)
#   clear_leave
#
# Full-screen moments, in priority order: timer's last minute / TIME'S UP,
# message, train passing, leave-by countdown, touchdown, scoreboard after a score, final score,
# plane overhead. Otherwise the screen is shared: music (or the clock and
# weather), with a timer bar on top while a timer runs and a Bears strip
# along the bottom during the game.

substitutions:
  panels: "3"          # panels chained left to right
  # Compass bearing the sign faces (straight up on the radar). The kitchen's
  # back wall faces north-northwest, ~16 degrees west of north.
  radar_heading: "344"

esphome:
  name: led-sign
  friendly_name: LED Sign
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
          else:
            - hub75.set_brightness:
                id: sign
                brightness: 0

esp32:
  board: adafruit_matrixportal_esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # The three panels' DMA buffers take most of the internal RAM; keep
      # TLS and Wi-Fi buffers in PSRAM.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: quad

logger:

api:
  actions:
    - action: show_message
      variables:
        line1: string
        line2: string
        seconds: int
      then:
        - lambda: |-
            id(msg_line1) = line1;
            id(msg_line2) = line2;
            id(msg_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 30);
    - action: show_timer
      variables:
        label: string
        remaining: int
        duration: int
      then:
        - lambda: |-
            id(timer_label) = label.empty() ? std::string("TIMER") : label;
            id(timer_end) = id(sntp_time).now().timestamp + remaining;
            id(timer_duration) = duration > 0 ? duration : remaining;
    - action: clear_timer
      then:
        - lambda: 'id(timer_end) = 0;'
    # Leave-by countdown for the next calendar event with an address. HA
    # works out the drive (Waze, live traffic) and the time to leave; the
    # sign counts down to leave_ts on its own and stops at start_ts.
    - action: show_leave
      variables:
        title: string
        at: string
        leave_ts: int
        start_ts: int
        drive: int
        traffic: int
      then:
        - lambda: |-
            id(lv_title) = title;
            id(lv_at) = at;
            id(lv_leave) = leave_ts;
            id(lv_start) = start_ts;
            id(lv_drive) = drive;
            id(lv_traffic) = traffic;
    - action: clear_leave
      then:
        - lambda: 'id(lv_start) = 0;'
    - action: show_train
      variables:
        company: string
        name: string
        train_number: int
        westbound: bool
        dest: string
        late: int
        seconds: int
      then:
        - lambda: |-
            // A new train (not a refresh of the one showing) restarts the
            // full-width entrance animation.
            if (id(tr_until) <= id(sntp_time).now().timestamp || train_number != id(tr_number))
              id(tr_start) = millis();
            id(tr_operator) = company;
            id(tr_name) = name;
            id(tr_number) = train_number;
            id(tr_west) = westbound;
            id(tr_dest) = dest;
            id(tr_late) = late;
            id(tr_until) = id(sntp_time).now().timestamp + (seconds > 0 ? seconds : 60);
    - action: show_plane
      variables:
        flight: string
        aircraft: string
        route: string
        airline: string
        altitude: int
        rate: int
        speed: float
        track: float
        dx: float
        dy: float
        radius: float
      then:
        - lambda: |-
            if (flight != id(pl_flight)) id(pl_trail).clear();
            id(pl_flight) = flight;
            id(pl_type) = aircraft;
            id(pl_route) = route;
            id(pl_airline) = airline;
            id(pl_alt) = altitude;
            id(pl_rate) = rate;
            id(pl_gs) = speed;
            id(pl_track) = track;
            id(pl_dx) = dx;
            id(pl_dy) = dy;
            id(pl_radius) = radius > 0 ? radius : 1.5f;
            id(pl_trail).push_back({dx, dy});
            if (id(pl_trail).size() > 8) id(pl_trail).erase(id(pl_trail).begin());
            id(pl_last_seen) = id(sntp_time).now().timestamp;
            id(pl_ms) = millis();
    - action: clear_plane
      then:
        - lambda: |-
            id(pl_last_seen) = 0;
            id(pl_flight).clear();
    - action: show_now_playing
      variables:
        title: string
        artist: string
        source: string
        art_url: string
      then:
        - lambda: |-
            id(np_title) = title;
            id(np_artist) = artist;
            id(np_source) = source;
            id(np_active) = true;
        - if:
            condition:
              lambda: 'return art_url != id(np_art_url);'
            then:
              - lambda: |-
                  id(np_art_url) = art_url;
                  id(np_art_ok) = false;
              - if:
                  condition:
                    lambda: 'return !art_url.empty();'
                  then:
                    - online_image.set_url:
                        id: album_art
                        url: !lambda 'return art_url;'
                    - component.update: album_art
    - action: clear_now_playing
      then:
        - lambda: 'id(np_active) = false;'
    # Bears game (HA, from ESPN). Score changes trigger the touchdown /
    # scoreboard screens; the end of a game triggers the final-score screen.
    - action: show_game
      variables:
        game_state: string
        kickoff: string
        opponent: string
        at_home: bool
        us_score: int
        opp_score: int
        status: string
        down_text: string
        possession: int
        channel: string
        us_color: string
        us_alt: string
        opp_color: string
        opp_alt: string
      then:
        - lambda: |-
            const int64_t t = id(sntp_time).now().timestamp;
            if (game_state == "in" && id(g_state) == "in" && opponent == id(g_opp)) {
              if (us_score - id(g_us) >= 6) {
                id(g_td_until) = t + 10;
                id(g_b1_until) = t + 25;
              } else if (us_score != id(g_us) || opp_score != id(g_them)) {
                id(g_b1_until) = t + 15;
              }
            }
            if (game_state == "post" && id(g_state) == "in") id(g_b6_until) = t + 900;
            id(g_state) = game_state;
            id(g_kick) = kickoff;
            id(g_opp) = opponent;
            id(g_home) = at_home;
            id(g_us) = us_score;
            id(g_them) = opp_score;
            id(g_status) = status;
            id(g_down) = down_text;
            id(g_poss) = possession;
            id(g_channel) = channel;
            id(g_us_c) = us_color;
            id(g_us_a) = us_alt;
            id(g_opp_c) = opp_color;
            id(g_opp_a) = opp_alt;
    - action: clear_game
      then:
        - lambda: |-
            id(g_state).clear();
            id(g_td_until) = 0;
            id(g_b1_until) = 0;
            id(g_b6_until) = 0;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Both sources set the same system clock, so the sign keeps time if either the
# internet (NTP) or Home Assistant is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
  - platform: homeassistant
    timezone: America/Chicago

# Only used to download album art from Home Assistant.
http_request:
  timeout: 4s

debug:
  update_interval: 60s

globals:
  - id: wx_temp
    type: float
    initial_value: 'NAN'
  - id: wx_hi
    type: float
    initial_value: 'NAN'
  - id: wx_lo
    type: float
    initial_value: 'NAN'
  - id: wx_code        # WMO-style code that picks the icon, -1 = no weather yet
    type: int
    initial_value: '-1'
  - id: wx_label
    type: std::string
  - id: wx_ts          # when the last good weather arrived (0 = never)
    type: int64_t
    initial_value: '0'
  - id: wx_lvl         # 0 light .. 2 heavy (animation strength)
    type: int
    initial_value: '0'
  - id: tm_code        # tomorrow's icon code, -1 = not known yet
    type: int
    initial_value: '-1'
  - id: tm_label
    type: std::string
  - id: msg_line1
    type: std::string
  - id: msg_line2
    type: std::string
  - id: msg_until
    type: int64_t
    initial_value: '0'
  - id: timer_label
    type: std::string
  - id: timer_end
    type: int64_t
    initial_value: '0'
  - id: timer_duration
    type: int
    initial_value: '0'
  # Leave-by countdown (pushed from HA)
  - id: lv_title
    type: std::string
  - id: lv_at          # event start as text, e.g. "8:00"
    type: std::string
  - id: lv_leave
    type: int64_t
    initial_value: '0'
  - id: lv_start       # 0 = nothing to show
    type: int64_t
    initial_value: '0'
  - id: lv_drive       # minutes with live traffic
    type: int
    initial_value: '0'
  - id: lv_traffic     # minutes traffic adds over a normal drive
    type: int
    initial_value: '0'
  # Plane overhead (pushed from HA)
  - id: pl_flight
    type: std::string
  - id: pl_type
    type: std::string
  - id: pl_route
    type: std::string
  - id: pl_airline
    type: std::string
  - id: pl_alt
    type: int
    initial_value: '0'
  - id: pl_rate
    type: int
    initial_value: '0'
  - id: pl_gs
    type: float
    initial_value: '0'
  - id: pl_track
    type: float
    initial_value: '0'
  - id: pl_dx          # miles east of home
    type: float
    initial_value: '0'
  - id: pl_dy          # miles north of home
    type: float
    initial_value: '0'
  - id: pl_radius      # radar scale (HA's plane radius), miles
    type: float
    initial_value: '1.5'
  - id: pl_last_seen
    type: int64_t
    initial_value: '0'
  - id: pl_ms          # millis() of the last position, for gliding between updates
    type: uint32_t
    initial_value: '0'
  - id: pl_trail
    type: std::vector<std::pair<float, float>>
  # Train passing (pushed from HA)
  - id: tr_operator
    type: std::string
  - id: tr_name
    type: std::string
  - id: tr_number
    type: int
    initial_value: '0'
  - id: tr_west
    type: bool
    initial_value: 'false'
  - id: tr_dest
    type: std::string
  - id: tr_late
    type: int
    initial_value: '0'
  - id: tr_until
    type: int64_t
    initial_value: '0'
  - id: tr_start       # millis() when the current train arrived (animation clock)
    type: uint32_t
    initial_value: '0'
  # Now playing (pushed from HA)
  - id: np_active
    type: bool
    initial_value: 'false'
  - id: np_title
    type: std::string
  - id: np_artist
    type: std::string
  - id: np_source
    type: std::string
  - id: np_art_url
    type: std::string
  - id: np_art_ok
    type: bool
    initial_value: 'false'
  # Bears game (pushed from HA)
  - id: g_state   # "pre", "in", "post", or empty = no game today
    type: std::string
  - id: g_kick
    type: std::string
  - id: g_opp
    type: std::string
  - id: g_home
    type: bool
    initial_value: 'true'
  - id: g_us
    type: int
    initial_value: '0'
  - id: g_them
    type: int
    initial_value: '0'
  - id: g_status
    type: std::string
  - id: g_down
    type: std::string
  - id: g_poss   # 1 = Bears have the ball, -1 = opponent
    type: int
    initial_value: '0'
  - id: g_channel
    type: std::string
  - id: g_us_c
    type: std::string
  - id: g_us_a
    type: std::string
  - id: g_opp_c
    type: std::string
  - id: g_opp_a
    type: std::string
  - id: g_td_until
    type: int64_t
    initial_value: '0'
  - id: g_b1_until
    type: int64_t
    initial_value: '0'
  - id: g_b6_until
    type: int64_t
    initial_value: '0'

switch:
  - platform: template
    name: "Display"
    id: display_on
    icon: mdi:television
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: sign
          brightness: !lambda 'return (int) (id(brightness_pct).state * 255 / 100);'
    turn_off_action:
      - hub75.set_brightness:
          id: sign
          brightness: 0
  - platform: template
    name: "Show planes"
    id: show_planes
    icon: mdi:airplane
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Show trains"
    id: show_trains
    icon: mdi:train
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      - if:
          condition:
            switch.is_on: display_on
          then:
            - hub75.set_brightness:
                id: sign
                brightness: !lambda 'return (int) (x * 255 / 100);'

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "Free memory"
  # Weather from Home Assistant (Met.no, falling back to Open-Meteo). Gaps
  # (unavailable / NaN) are ignored so the last good reading stays up.
  - platform: homeassistant
    id: ha_wx_temp
    entity_id: sensor.led_sign_temperature
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) return;
          id(wx_temp) = x;
          id(wx_ts) = id(sntp_time).now().timestamp;
  - platform: homeassistant
    id: ha_wx_hi
    entity_id: sensor.led_sign_today_high
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_hi) = x;'
  - platform: homeassistant
    id: ha_wx_lo
    entity_id: sensor.led_sign_today_low
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_lo) = x;'
  - platform: homeassistant
    id: ha_wx_lvl
    entity_id: sensor.led_sign_weather_intensity
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(wx_lvl) = (int) x;'
  # Tomorrow's forecast (evening card)
  - platform: homeassistant
    id: ha_tm_hi
    entity_id: sensor.led_sign_tomorrow_high
    internal: true
  - platform: homeassistant
    id: ha_tm_lo
    entity_id: sensor.led_sign_tomorrow_low
    internal: true

text_sensor:
  - platform: homeassistant
    id: ha_wx_condition
    entity_id: sensor.led_sign_weather_condition
    internal: true
    on_value:
      - lambda: |-
          // HA weather condition -> label and icon code (codes follow the WMO
          // numbering the icon drawing uses).
          struct Wx { const char *ha, *label; int code; };
          static const Wx table[] = {
            {"sunny", "SUNNY", 0}, {"clear-night", "CLEAR", 100},
            {"partlycloudy", "PT CLOUDY", 2}, {"cloudy", "CLOUDY", 3},
            {"fog", "FOG", 45}, {"rainy", "RAIN", 61}, {"pouring", "RAIN", 65},
            {"snowy", "SNOW", 71}, {"snowy-rainy", "SLEET", 67}, {"hail", "HAIL", 96},
            {"lightning", "STORM", 95}, {"lightning-rainy", "STORM", 95},
            {"windy", "WINDY", 4}, {"windy-variant", "WINDY", 4},
            {"exceptional", "ALERT", 3},
          };
          // Unknown/unavailable: keep the last good condition.
          for (const auto &w : table)
            if (x == w.ha) { id(wx_label) = w.label; id(wx_code) = w.code; break; }
  - platform: homeassistant
    id: ha_tm_condition
    entity_id: sensor.led_sign_tomorrow_condition
    internal: true
    on_value:
      - lambda: |-
          // Same mapping as today's condition above.
          struct Wx { const char *ha, *label; int code; };
          static const Wx table[] = {
            {"sunny", "SUNNY", 0}, {"clear-night", "CLEAR", 100},
            {"partlycloudy", "PT CLOUDY", 2}, {"cloudy", "CLOUDY", 3},
            {"fog", "FOG", 45}, {"rainy", "RAIN", 61}, {"pouring", "RAIN", 65},
            {"snowy", "SNOW", 71}, {"snowy-rainy", "SLEET", 67}, {"hail", "HAIL", 96},
            {"lightning", "STORM", 95}, {"lightning-rainy", "STORM", 95},
            {"windy", "WINDY", 4}, {"windy-variant", "WINDY", 4},
            {"exceptional", "ALERT", 3},
          };
          for (const auto &w : table)
            if (x == w.ha) { id(tm_label) = w.label; id(tm_code) = w.code; break; }
  - platform: debug
    reset_reason:
      name: "Last restart reason"

binary_sensor:
  # On from 6 PM the night before pickup until the bins are marked out
  # (HA's "Trash night reminder" automation).
  - platform: homeassistant
    id: ha_trash
    entity_id: input_boolean.trash_reminder
    internal: true

image:
  - platform: online_image
    id: album_art
    url: "http://localhost/none.jpg"   # replaced by show_now_playing
    format: JPEG
    type: RGB565
    resize: 64x64
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      - lambda: 'id(np_art_ok) = true;'
    on_error:
      - lambda: 'id(np_art_ok) = false;'

  # NFL team logos from ESPN, downloaded when the firmware is built: 28 px for
  # the scoreboard, 13 px for the score strip.
  - platform: file
    defaults:
      type: RGB565
      transparency: alpha_channel
      resize: 28x28
    files:
      - {id: logo_l_ari, file: "https://a.espncdn.com/i/teamlogos/nfl/500/ari.png"}
      - {id: logo_l_atl, file: "https://a.espncdn.com/i/teamlogos/nfl/500/atl.png"}
